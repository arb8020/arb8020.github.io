---
layout: default
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body {
            font-family: monospace;
            line-height: 1.4;
            margin: 0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f5f5f5;
        }
        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 10px;
        }
        a {
            color: #000;
            text-decoration: underline;
        }
        .poem-columns {
            display: flex;
            gap: 40px;
        }
        .poem-columns .stanza {
            flex: 1;
        }
        @media (max-width: 500px) {
            .poem-columns {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <h1>{{ page.title }}</h1>
    <p><a href="/">← back to home</a></p>

    <article>
        {{ content }}
    </article>

    <p><a href="/">← back to home</a></p>
</body>
</html>

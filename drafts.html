<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drafts - arb8020</title>
    <style>
        body {
            font-family: 'Menlo', 'Courier New', monospace;
            line-height: 1.4;
            margin: 0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f5f5f5;

        h1, h2 {

            font-weight: bold;

        ul {

        li::before {
            content: "- ";
        }

    <h1>drafts / work in progress</h1>
    
    <p><a href="{{ '/' | relative_url }}">← back to home</a></p>

    <ul>
    {% for draft in site.drafts %}
        <li><a href="{{ draft.url | relative_url }}">{{ draft.title }}</a></li>
    {% endfor %}
    </ul>

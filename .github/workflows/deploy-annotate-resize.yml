name: Build annotate-resize

on:
  push:
    branches: [main]
    paths:
      - 'annotate-resize/src/**'
      - 'annotate-resize/package*.json'
      - 'annotate-resize/vite.config.ts'
      - 'annotate-resize/index.html'
      - '.github/workflows/deploy-annotate-resize.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: annotate-resize/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: annotate-resize

      - name: Build
        run: npm run build
        working-directory: annotate-resize

      - name: Commit dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add annotate-resize/dist/
          git diff --cached --quiet || git commit -m "build: update annotate-resize dist"
          git push

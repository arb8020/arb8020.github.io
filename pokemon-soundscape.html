<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pokémon Soundscape</title>
<style>
  :root {
    --paper: #f6f1e3;
    --ink: #2a2620;
    --rule: #c9bfa6;
    --rule-soft: #e3dac0;
    --accent: #5a7a3d;        /* moss */
    --accent-deep: #3e5628;
    --accent-warn: #8a3a2a;
    --muted: #6b6353;
    --hl: #f0e6c8;
  }
  html { background: var(--paper); }
  body { background: var(--paper); }
  html.immersive { background: transparent; }
  body {
    font-family: "Iowan Old Style", "Charter", "Georgia", serif;
    font-size: 17px; line-height: 1.45;
    max-width: 860px; margin: 2.4em auto; padding: 0 1.4em;
    color: var(--ink);
  }

  /* Hamburger + sidebar */
  #hamburger {
    position: fixed; top: 1.2em; right: 1.4em;
    width: 36px; height: 36px;
    background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(6px);
    border: 1px solid var(--rule); border-radius: 4px;
    cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 4px;
  }
  #hamburger span {
    display: block; width: 18px; height: 2px; background: var(--ink);
  }
  #sidebar {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 360px; max-width: 90vw;
    background: var(--paper); border-left: 1px solid var(--rule);
    box-shadow: -2px 0 12px rgba(0,0,0,0.08);
    overflow-y: auto; padding: 4em 1.4em 1.4em 1.4em;
    transform: translateX(100%); transition: transform 0.18s ease-out;
    z-index: 99;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebar section.panel:first-of-type { margin-top: 0; border-top: none; padding-top: 0; }
  #sidebar h3 {
    font-size: 0.78em; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted);
    margin: 1.4em 0 0.6em 0;
  }
  #sidebar h3:first-child { margin-top: 0; }
  details.advanced summary {
    font-size: 0.78em; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted);
    cursor: pointer; padding: 0.6em 0;
    border-top: 1px solid var(--rule);
    margin-top: 1em;
  }

  /* Search bar */
  #searchWrap { position: relative; margin: 1.2em 0; }
  #searchInput {
    width: 100%; padding: 0.7em 0.9em; font-size: 1.05em;
    background: #fffaf0; border: 1px solid var(--rule); border-radius: 4px;
    font-family: inherit; color: var(--ink);
  }
  #searchInput:focus { outline: none; border-color: var(--accent); }
  #searchResults {
    position: absolute; top: 100%; left: 0; right: 0;
    background: var(--paper); border: 1px solid var(--rule);
    border-top: none; border-radius: 0 0 4px 4px;
    max-height: 320px; overflow-y: auto;
    z-index: 50;
    display: none;
  }
  #searchResults.open { display: block; }
  #searchResults .result {
    padding: 0.5em 0.9em; cursor: pointer;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 0.95em;
  }
  #searchResults .result:hover, #searchResults .result.active {
    background: var(--hl);
  }
  #searchResults .result .tag {
    color: var(--muted); font-size: 0.82em; margin-right: 0.5em;
    font-variant: small-caps; letter-spacing: 0.04em;
  }
  #searchResults .result .area { color: var(--muted); font-size: 0.85em; }

  /* --- Immersive mode --- */
  body.immersive {
    max-width: none; margin: 0; padding: 0;
    overflow: hidden; height: 100vh;
    background: transparent;
  }
  body.immersive #routeTitle, body.immersive #routeSub,
  body.immersive #searchWrap:not(.focus),
  body.immersive > .panel,
  body.immersive > section.panel,
  body.immersive > .row-flex,
  body.immersive > #status {
    display: none !important;
  }

  /* The layout image becomes the page background. Z-index 0 sits above the
     html/body paint but below all positioned UI (which uses z-index >= 2).
     background-size: auto so big images keep their natural size and pan;
     when smaller than the viewport, the explicit cover fallback (set in JS
     based on image dims) ensures no empty borders. */
  #immersiveBg {
    position: fixed; inset: 0; z-index: 0;
    background-size: auto; background-repeat: no-repeat;
    background-color: var(--paper);
    image-rendering: pixelated;
    display: none;
  }
  body.immersive #immersiveBg { display: block; }
  body.immersive #immersiveBg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.25) 100%);
    pointer-events: none;
  }

  /* Sprite stage in immersive mode: full viewport so sprites can be positioned
     in image-space coords and follow the pan. The sprite's *position* lives
     on a wrapping <div class="sprite-pos">; the inner <div class="sprite">
     runs the entry animation. Splitting them avoids the keyframe transform
     overwriting the position translate. */
  body.immersive #stage {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 2;
    background: none; border: none;
    height: auto;
  }
  body.immersive .sprite-pos {
    position: absolute; top: 0; left: 0;
    transform: translate(var(--sx, 0), var(--sy, 0));
    pointer-events: auto;
  }
  body.immersive .sprite-pos .sprite {
    position: static;
    bottom: auto;
  }

  /* Edge-zones for hover-to-reveal connection arrows. */
  .edge-zone {
    position: fixed; z-index: 5; pointer-events: auto;
  }
  .edge-zone.west  { top: 20%; bottom: 20%; left: 0;   width: 80px; }
  .edge-zone.east  { top: 20%; bottom: 20%; right: 0;  width: 80px; }
  .edge-zone.north { left: 20%; right: 20%; top: 0;    height: 80px; }
  .edge-zone.south { left: 20%; right: 20%; bottom: 0; height: 80px; }
  .edge-zone .conns {
    position: absolute; display: flex; gap: 0.5em; opacity: 0;
    transition: opacity 0.2s; pointer-events: auto;
  }
  .edge-zone:hover .conns { opacity: 1; }
  .edge-zone.west .conns  { left: 0.6em; top: 50%; transform: translateY(-50%); flex-direction: column; }
  .edge-zone.east .conns  { right: 0.6em; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: flex-end; }
  .edge-zone.north .conns { top: 0.6em; left: 50%; transform: translateX(-50%); }
  .edge-zone.south .conns { bottom: 0.6em; left: 50%; transform: translateX(-50%); }
  .edge-conn {
    background: rgba(246, 241, 227, 0.92); backdrop-filter: blur(6px);
    border: 1px solid var(--ink); border-radius: 4px;
    padding: 0.4em 0.8em; font-size: 0.92em; color: var(--ink);
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .edge-conn:hover { background: var(--hl); }

  /* Immersive search bar: shown only when focused (via "/"). */
  body.immersive #searchWrap {
    position: fixed; top: 1.4em; left: 50%; transform: translateX(-50%);
    width: min(560px, 80vw); margin: 0; z-index: 20;
    display: none;
  }
  body.immersive #searchWrap.focus { display: block; }
  body.immersive #searchInput {
    background: rgba(246, 241, 227, 0.92); backdrop-filter: blur(8px);
    border: 1px solid var(--ink); box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }

  /* Map button (top-left) + popover. */
  #mapBtn {
    position: fixed; top: 1.2em; left: 1.4em; z-index: 50;
    width: 36px; height: 36px;
    background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(6px);
    border: 1px solid var(--rule); border-radius: 4px;
    cursor: pointer; display: none;
    align-items: center; justify-content: center;
    font-size: 1.2em;
  }
  body.immersive #mapBtn { display: flex; }

  /* Minimap: shows up briefly while panning. The outer box's dimensions
     track the layout image's aspect ratio (capped at MAX), so a wide route
     gives a wide minimap and a tall dungeon gives a tall one. */
  #minimap {
    position: fixed; top: 1.2em; left: 5em; z-index: 50;
    background: transparent;
    border: 1px solid rgba(42, 38, 32, 0.5);
    border-radius: 4px;
    padding: 4px;
    pointer-events: none;
    opacity: 0; transition: opacity 0.3s;
    display: none;
  }
  body.immersive #minimap { display: block; }
  #minimap.show { opacity: 1; }
  #minimapInner {
    position: relative; width: 100%; height: 100%;
    background: transparent;
    border-radius: 2px;
  }
  #minimapView {
    position: absolute;
    border: 1.5px solid var(--accent-warn);
    border-radius: 1px;
  }
  .minimap-sprite {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--accent);
    border: 1px solid var(--accent-deep);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* Music player (bottom-right). Collapsed: ♪ icon + truncated track title.
     Expanded: prev/play/next/scrub. Visible in both modes. */
  #player {
    position: fixed; bottom: 1.2em; right: 1.4em; z-index: 50;
    background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(10px);
    border: 1px solid var(--rule); border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    display: flex; align-items: center;
    padding: 0.35em 0.7em;
    font-size: 0.88em;
    cursor: pointer;
    max-width: 260px;
    transition: max-width 0.2s, border-radius 0.2s;
    user-select: none;
  }
  #player .player-icon {
    font-size: 1.1em; margin-right: 0.5em; line-height: 1;
  }
  #player .player-title {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #player .player-controls { display: none; }
  #player.expanded {
    max-width: 380px;
    border-radius: 8px;
    flex-direction: column; align-items: stretch;
    padding: 0.5em 0.8em;
  }
  #player.expanded .player-row { display: flex; align-items: center; gap: 0.5em; }
  #player.expanded .player-controls {
    display: flex; gap: 0.3em; align-items: center;
    margin-top: 0.4em;
  }
  #player .player-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 0.15em 0.45em; font-size: 1em; color: var(--ink);
    font-family: inherit;
  }
  #player .player-btn:hover { background: var(--hl); border-radius: 3px; }
  #player .player-scrub {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--rule); border-radius: 2px;
    margin: 0 0.4em;
  }
  #player .player-scrub::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
  }
  #player .player-time {
    font-family: "SF Mono", Menlo, monospace; font-size: 0.78em;
    color: var(--muted); min-width: 70px; text-align: right;
  }
  #player .player-candidates {
    max-height: 200px; overflow-y: auto;
    margin-top: 0.5em; border-top: 1px solid var(--rule-soft);
    padding-top: 0.4em; display: none;
  }
  #player.show-candidates .player-candidates { display: block; }
  #player .player-candidate {
    padding: 0.25em 0.5em; cursor: pointer;
    font-size: 0.85em;
    border-radius: 3px;
  }
  #player .player-candidate:hover { background: var(--hl); }
  #player .player-candidate.active { background: var(--accent); color: #fffaf0; }

  /* Encounter widget (bottom-left). Mirror of the map button: small toggle,
     click to expand the panel. */
  #encBtn {
    position: fixed; bottom: 1.2em; left: 1.4em; z-index: 50;
    width: 36px; height: 36px;
    background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(6px);
    border: 1px solid var(--rule); border-radius: 4px;
    cursor: pointer; display: none;
    align-items: center; justify-content: center;
    font-size: 1.05em;
  }
  body.immersive #encBtn { display: flex; }
  #encPanel {
    position: fixed; bottom: 4em; left: 1.4em; z-index: 49;
    width: 320px; max-height: 70vh; overflow-y: auto;
    background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(10px);
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 0.8em 0.9em;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: none;
  }
  #encPanel.open { display: block; }
  #encPanel .method-pills { display: flex; flex-wrap: wrap; gap: 0.3em; margin-bottom: 0.5em; }
  #encPanel .method-pill {
    padding: 0.15em 0.55em; font-size: 0.78em;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 999px; cursor: pointer;
    font-family: inherit; color: var(--ink);
  }
  #encPanel .method-pill.active {
    background: var(--accent); color: #fffaf0; border-color: var(--accent-deep);
  }
  #encPanel .method-pill:hover { background: var(--hl); }
  #encPanel .method-pill.active:hover { background: var(--accent-deep); }
  #encPanel select {
    margin-bottom: 0.5em;
  }
  #encPanel .enc-row {
    display: flex; align-items: center; gap: 0.5em;
    padding: 0.2em 0; border-bottom: 1px solid var(--rule-soft);
    font-size: 0.88em;
  }
  #encPanel .enc-row:last-child { border-bottom: none; }
  #encPanel .enc-row img {
    width: 32px; height: 32px; object-fit: contain;
    image-rendering: pixelated;
  }
  #encPanel .enc-row .name { flex: 1; font-variant: small-caps; letter-spacing: 0.04em; }
  #encPanel .enc-row .pct { font-family: "SF Mono", Menlo, monospace; font-size: 0.82em; color: var(--muted); }
  #encPanel .enc-section { font-size: 0.74em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0.6em 0 0.3em 0; }
  #mapPopover {
    position: fixed; top: 4em; left: 1.4em; z-index: 49;
    width: 320px; max-height: 70vh; overflow-y: auto;
    background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(10px);
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 1em; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    display: none;
  }
  #mapPopover.open { display: block; }
  #mapPopover img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
  #mapPopover .conn-list { display: flex; flex-wrap: wrap; gap: 0.4em; margin-top: 0.6em; }

  /* Route caption (bottom-center) — minimal "you are here" indicator. */
  #immersiveCaption {
    position: fixed; bottom: 1em; left: 50%; transform: translateX(-50%);
    z-index: 4; padding: 0.4em 1em; font-size: 0.95em;
    background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(6px);
    border: 1px solid var(--rule); border-radius: 4px;
    font-variant: small-caps; letter-spacing: 0.06em;
    display: none;
  }
  body.immersive #immersiveCaption { display: block; }

  /* Mode toggle button (in sidebar). */
  #modeToggle { width: 100%; margin-top: 0.6em; }

  /* BGM resolution trace */
  .trace { background: #efe7d0; border: 1px solid var(--rule-soft); border-radius: 3px; padding: 0.5em 0.7em; }
  .trace .step { display: flex; gap: 0.5em; margin: 0.25em 0; align-items: baseline; line-height: 1.3; }
  .trace .step .arrow { color: var(--muted); font-family: "SF Mono", Menlo, monospace; }
  .trace .step .label { color: var(--muted); font-variant: small-caps; letter-spacing: 0.06em; min-width: 4.5em; font-size: 0.82em; }
  .trace .step .val { font-family: "SF Mono", Menlo, monospace; font-size: 0.82em; word-break: break-word; }
  .trace .step .val.picked { color: var(--accent-deep); font-weight: 600; }
  .trace .step .val.error { color: var(--accent-warn); }
  .trace details { margin-top: 0.4em; }
  .trace details summary { color: var(--muted); font-size: 0.78em; cursor: pointer; }
  .trace .row { font-family: "SF Mono", Menlo, monospace; font-size: 0.78em; padding: 0.15em 0; color: var(--muted); }
  .trace .row.picked { color: var(--accent-deep); font-weight: 600; }
  h1 {
    font-family: "Iowan Old Style", "Charter", "Georgia", serif;
    font-size: 1.9em; font-weight: 700; letter-spacing: 0.01em;
    margin: 0; padding-bottom: 0.1em; border-bottom: 2px solid var(--ink);
  }
  .sub { color: var(--muted); font-style: italic; margin: 0.3em 0 1.4em 0; }

  section.panel {
    border: none; padding: 0; margin: 1.6em 0;
    border-top: 1px solid var(--rule);
    padding-top: 0.9em;
  }
  section.panel > h2 {
    font-size: 0.78em; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--muted);
    margin: 0 0 0.7em 0;
  }

  label { display: inline-block; margin: 0.25em 0; color: var(--ink); }
  input[type="text"], select {
    padding: 0.3em 0.45em; font-size: 0.95em;
    background: #fffaf0; border: 1px solid var(--rule);
    border-radius: 2px; color: var(--ink);
    font-family: inherit;
  }
  input[type="number"] { width: 4.5em; padding: 0.3em; background: #fffaf0; border: 1px solid var(--rule); border-radius: 2px; }
  input[type="range"] { vertical-align: middle; accent-color: var(--accent); }
  small { color: var(--muted); }

  button {
    padding: 0.42em 0.95em; font-size: 0.92em; cursor: pointer;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--ink); border-radius: 2px;
    font-family: inherit; letter-spacing: 0.02em;
    transition: background 0.1s;
  }
  button:hover:not(:disabled) { background: var(--hl); }
  button:disabled { color: var(--muted); border-color: var(--rule); cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fffaf0; border-color: var(--accent-deep); }
  button.primary:hover:not(:disabled) { background: var(--accent-deep); }
  button.stop { background: var(--accent-warn); color: #fffaf0; border-color: var(--accent-warn); }

  #status {
    margin: 0.6em 0; font-family: "SF Mono", Menlo, monospace;
    font-size: 0.82em; color: var(--muted); min-height: 1.2em;
  }
  details.log-details summary {
    cursor: pointer; color: var(--muted); font-size: 0.82em;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.3em 0; user-select: none;
  }
  #log {
    font-family: "SF Mono", Menlo, monospace; font-size: 0.78em;
    background: #efe7d0; color: var(--ink);
    padding: 0.6em 0.8em; border-radius: 2px;
    height: 9em; overflow-y: auto; white-space: pre-wrap;
    border: 1px solid var(--rule-soft);
  }

  table { border-collapse: collapse; width: 100%; font-size: 0.95em; }
  th, td { text-align: left; padding: 0.4em 0.7em; border-bottom: 1px solid var(--rule-soft); }
  th {
    font-size: 0.74em; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--rule);
    background: transparent;
  }
  td.species { font-variant: small-caps; letter-spacing: 0.04em; }
  td.num { font-family: "SF Mono", Menlo, monospace; font-size: 0.88em; color: var(--muted); text-align: right; }

  .row-flex { display: flex; gap: 1.1em; align-items: center; flex-wrap: wrap; }
  .row-flex > label { margin: 0; }

  .help { color: var(--muted); font-size: 0.85em; font-style: italic; margin: 0.5em 0 0 0; }

  /* Sprite pop-up stage */
  #stage {
    position: relative;
    height: 110px;
    margin: 1em 0 0 0;
    overflow: hidden;
    border-top: 1px dashed var(--rule);
    border-bottom: 1px dashed var(--rule);
    background:
      repeating-linear-gradient(
        90deg,
        transparent 0 18px,
        rgba(90, 122, 61, 0.04) 18px 36px
      );
  }
  .sprite {
    position: absolute;
    bottom: 4px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    width: 96px; height: 96px;
    animation: sprite-entry 1.4s ease-out forwards;
    pointer-events: auto;
    cursor: default;
    transition: opacity 0.4s;
  }
  .sprite.fading { opacity: 0; }
  /* Replay the entry animation when the user hovers a settled sprite. */
  .sprite:hover { animation: sprite-entry 1.4s ease-out forwards; }
  .sprite img { width: 100%; height: 100%; object-fit: contain; }
  .sprite .sprite-label {
    position: absolute; bottom: -6px; left: 50%;
    transform: translateX(-50%);
    font-variant: small-caps; letter-spacing: 0.06em;
    font-size: 0.78em; color: var(--ink);
    background: var(--paper); padding: 0 0.3em;
    white-space: nowrap;
  }
  /* Entry animation: pop in, bounce twice, settle. fill-mode: forwards keeps
     the sprite at its final state instead of fading out. The sprite is
     removed by JS after a timeout (or replayed on hover). */
  @keyframes sprite-entry {
    0%   { opacity: 0; transform: translateY(20px) scale(0.85); }
    20%  { opacity: 1; transform: translateY(0) scale(1.05); }
    36%  { transform: translateY(-6px) scale(1); }
    52%  { transform: translateY(0) scale(1); }
    68%  { transform: translateY(-3px) scale(1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* Old name preserved for the field-guide-mode CSS that still uses it. */
  @keyframes sprite-life { 0% { opacity: 0; } 100% { opacity: 1; } }

  /* Bulbapedia connections / location map */
  #connections { display: flex; gap: 0.5em; flex-wrap: wrap; margin: 0.4em 0; }
  #connections button { font-size: 0.88em; }
  #locationMapWrap, #regionMapWrap { position: relative; display: inline-block; max-width: 100%; }
  #locationMap, #regionMap { display: block; width: 432px; max-width: 100%; height: auto; image-rendering: pixelated; }
  #layoutImg { display: block; max-width: 100%; height: auto; image-rendering: pixelated; margin-top: 0.6em; }
  #layoutCaption { color: var(--muted); font-style: italic; font-size: 0.85em; margin-top: 0.2em; }
  .layout-variants { display: inline-flex; gap: 0.3em; margin-left: 0.6em; vertical-align: middle; }
  .layout-variant {
    padding: 0.15em 0.55em; font-size: 0.78em;
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 999px; cursor: pointer;
    font-family: inherit; color: var(--ink);
    text-transform: lowercase; font-style: normal;
    letter-spacing: 0.04em;
  }
  .layout-variant:hover { background: var(--hl); }
  .layout-variant.active { background: var(--accent); color: #fffaf0; border-color: var(--accent-deep); }
  /* In immersive mode, position the caption + variant pills floating above
     the bottom-center caption strip so the variant picker is reachable. */
  body.immersive #layoutCaption {
    position: fixed; bottom: 3.6em; left: 50%; transform: translateX(-50%);
    z-index: 4; background: rgba(246, 241, 227, 0.85); backdrop-filter: blur(6px);
    padding: 0.4em 0.9em; border: 1px solid var(--rule); border-radius: 4px;
    margin: 0; color: var(--ink); font-style: normal;
    display: block !important;
  }
  #locationOverlay, #regionOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #regionOverlay rect { pointer-events: auto; cursor: pointer; fill: rgba(90,122,61,0); stroke: rgba(90,122,61,0.4); stroke-width: 1; transition: fill 0.12s, stroke 0.12s; }
  #regionOverlay rect:hover { fill: rgba(90,122,61,0.4); stroke: rgba(90,122,61,0.9); }
  #regionOverlay rect.current { stroke: var(--accent-warn); stroke-width: 1.5; fill: rgba(138,58,42,0.18); }
  #locationOverlay polygon, #locationOverlay rect { pointer-events: auto; cursor: pointer; fill: rgba(90,122,61,0); transition: fill 0.15s; }
  #locationOverlay polygon:hover, #locationOverlay rect:hover { fill: rgba(90,122,61,0.25); }
  .map-caption { color: var(--muted); font-style: italic; font-size: 0.88em; margin-top: 0.3em; }
</style>
</head>
<body>

  <span></span><span></span><span></span>
</button>

</div>

<!-- Edge zones for hover-to-reveal connection arrows. Populated dynamically. -->

<div class="edge-zone east"  id="edgeEast"  style="display:none;"><div class="conns"></div></div>

<h1 id="routeTitle">Pokémon Soundscape</h1>

<!-- Layer 1: search bar -->
<div id="searchWrap">
  <input id="searchInput" type="text" placeholder="Search a location… (e.g. 'wayward 1f', 'sinnoh/route 208', 'twinleaf')" autocomplete="off">

</div>

<!-- Walk controls live in the sidebar; in field-guide mode the sidebar is open
     by default-ish via the hamburger. Status text always shows in the caption / sidebar. -->

<!-- Layer 1: layout image (the artwork) -->
<section class="panel" id="layoutPanel" style="display:none;border-top:none;padding-top:0;margin-top:0;">
  <img id="layoutImg" alt="" style="display:none;">

<!-- Sidebar: layer 2 / 3 controls -->
<aside id="sidebar">
  <!-- Hidden Start/Stop kept so legacy event handlers don't crash. Walking
       starts automatically once audio is unlocked; the music player's

  <button id="stop" class="stop" style="display:none" disabled>Stop</button>
  <div id="bgmStatusSidebar" style="margin-top:0.5em;font-family:'SF Mono',Menlo,monospace;font-size:0.85em;color:var(--muted);">no track loaded</div>

  <!-- Hidden canonical inputs. Visible UI elsewhere on the page mirrors these. -->
  <div style="display:none">
    <!-- Sink element used by renderTable; the visible encounter table lives in
         the bottom-left widget. -->
    <div id="encounters"></div>
    <button id="searchBgm">Search</button>

    </select>

      <option value="walk" selected>walk (grass)</option>
      <option value="surf">surf</option>

      <option value="good-rod">good-rod</option>
      <option value="super-rod">super-rod</option>

      <option value="rock-smash">rock-smash</option>
      <option value="headbutt">headbutt (HGSS)</option>
      <option value="dark-grass">dark-grass (BW)</option>
      <option value="grass-spots">grass-spots</option>
      <option value="cave-spots">cave-spots</option>
      <option value="bridge-spots">bridge-spots</option>
      <option value="surf-spots">surf-spots</option>
      <option value="seaweed">seaweed</option>
    </select>
    <select id="tod">
      <option value="auto" selected>auto (local)</option>
      <option value="time-morning">morning</option>
      <option value="time-day">day</option>
      <option value="time-night">night</option>
      <option value="any">any</option>
    </select>
    <input id="stepMean" type="number" min="0.2" step="0.1" value="1.0">
    <input id="encRate" type="number" min="0.001" max="1" step="0.01" value="0.05">
    <input id="vol" type="range" min="0" max="1" step="0.05" value="0.35">
    <input id="wanderOn" type="checkbox" checked>
    <input id="wanderRate" type="number" min="0" max="1" step="0.001" value="0.5">
    <span id="wanderStatus"></span>
  </div>

  <details class="advanced">
    <summary>Advanced</summary>
    <label style="margin-top:0.5em;display:block;">Slug
      <input id="slug" type="text" value="sinnoh-route-201-area" size="32">
    </label>
    <label style="margin-top:0.5em;display:block;">Proxy
      <input id="proxy" type="text" value="http://localhost:8787" size="32">
    </label>
    <label style="margin-top:0.5em;display:block;">Primary source
      <select id="primarySource">
        <option value="bulbapedia" selected>Bulbapedia</option>
        <option value="serebii">Serebii</option>
      </select>
    </label>
    <label style="margin-top:0.5em;display:block;font-size:0.85em;color:var(--muted);">
      <input id="fallbackEnabled" type="checkbox" checked>
      Fall back to the other source if primary is missing data
    </label>
    <button id="load" style="margin-top:0.6em;">Reload</button>
    <button id="rebuildIndex" style="margin-top:0.6em;">Rebuild search index</button>
  </details>

  <details class="log-details" style="margin-top:1em;">
    <summary>log</summary>
    <div id="log"></div>
  </details>
</aside>

<div id="status"></div>

<script>
"use strict";

const POKEAPI = "https://pokeapi.co/api/v2";
const SPRITE_LIFETIME_MS = 20000;

const $ = (id) => document.getElementById(id);
const status = (msg) => { $("status").textContent = msg; };
const log = (msg) => {
  const el = $("log");
  const ts = new Date().toLocaleTimeString();
  el.textContent = `[${ts}] ${msg}\n` + el.textContent;
};

// State
let encounters = []; // [{name, chance, cryUrl}] — combined across selected methods
let availableMethods = new Map(); // method -> count, derived from the loaded area for current version
let selectedMethods = new Set(["walk"]); // user-chosen methods to merge
let lastAreaData = null; // raw PokéAPI location-area JSON, kept so we can re-filter without refetch
let areaSiblings = []; // [{name, current}] - other areas under the same parent location
let _immersiveBgDims = null; // { w, h } of current immersive bg image, set on load
let _audioUnlocked = false;
// Direction the user just navigated *from*. The next refreshImmersiveBg will
// position the layout so the user "arrives" from that direction (e.g. came from
// a west neighbor → start scrolled all the way to the west edge of the new
// layout, so the eastward path is laid out before them).
let _arrivalFrom = null; // null | "west" | "east" | "north" | "south"
// Bytes fetched before the user has gestured; held until ensureAudio() can run.
let _pendingBgmBytes = null;
// BGM loop tracking. Wander rolls fire on each loop boundary, not per walk-step.
let _bgmLastPos = 0;
let _bgmLoopCount = 0;
let _isFirstLocationOfSession = true;
// Music player state.
let _playerCandidates = []; // last searchBgm result list (for prev/next/picker)
let _playerCurrent = null;  // currently playing candidate
let _playerSeekOffset = 0;  // seconds into the buffer at which startBgm was called
let _playerStartedAt = 0;   // audioCtx.currentTime when current source started
let _playerInterval = null; // setInterval for time readout
function oppositeDir(d) {
  return ({ west: "east", east: "west", north: "south", south: "north" })[d] || null;
}
let walking = false;
let walkTimer = null;
let audioCtx = null;
let masterGain = null;
let bgmGain = null;
let bgmSource = null;     // currently-playing AudioBufferSourceNode (loop)
let bgmBuffer = null;     // decoded audio buffer for current track
let bgmStartedAt = 0;     // audioCtx.currentTime when BGM source started
let currentConnections = []; // [{slug, name, direction}, ...] from Bulbapedia

function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1.0;
  masterGain.connect(audioCtx.destination);
  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = parseFloat($("bgmVol").value);
  bgmGain.connect(masterGain);
}

// --- Data loading ---

// Gen IV time bands: morning 04:00-09:59, day 10:00-19:59, night 20:00-03:59.
function localTimeBand() {
  const h = new Date().getHours();
  if (h >= 4 && h < 10) return "time-morning";
  if (h >= 10 && h < 20) return "time-day";
  return "time-night";
}

// Given a 404-ing area slug like "sinnoh-route-204-area", look up its parent
// location's actual areas. PokéAPI splits some routes into multiple areas
// (e.g., Route 204 = north + south halves) which Bulbapedia papers over.
// Returns [{name, ...}] or [] if no parent location exists.
async function findSiblingAreas(slug) {
  // Strip the trailing "-area"; that's the convention Bulbapedia-derived
  // slugs use, and PokéAPI's location names are the same minus that suffix.
  const locName = slug.replace(/-area$/, "");
  try {
    const res = await fetch(`${POKEAPI}/location/${locName}`);
    if (!res.ok) return [];
    const data = await res.json();
    return data.areas || [];
  } catch {
    return [];
  }
}

async function loadEncounters() {
  let slug = $("slug").value.trim();
  const version = $("version").value;
  const todChoice = $("tod").value;
  const band = todChoice === "auto" ? localTimeBand()
             : todChoice === "any" ? null
             : todChoice;
  if (todChoice === "auto") log(`local time band: ${band}`);

  status(`Fetching ${slug}...`);

  let area;
  try {
    let res = await fetch(`${POKEAPI}/location-area/${slug}`);
    if (res.status === 404) {
      // The synthetic slug missed; the parent location may have differently-
      // named areas (Route 204 = north + south halves). Auto-pick the first
      // and surface all of them in the encounter widget so the user can swap.
      const siblings = await findSiblingAreas(slug);
      if (siblings.length > 0) {
        log(`${slug} 404; parent has ${siblings.length} area(s): ${siblings.map((a) => a.name).join(", ")}`);
        slug = siblings[0].name;
        $("slug").value = slug;
        areaSiblings = siblings.map((a) => ({ name: a.name }));
        res = await fetch(`${POKEAPI}/location-area/${slug}`);
        if (!res.ok) throw new Error(`fallback area HTTP ${res.status}`);
      } else {
        encounters = [];
        lastAreaData = null;
        availableMethods = new Map();
        areaSiblings = [];
        $("encounters").innerHTML = `<em style="color:var(--muted)">no wild encounters here (no PokéAPI areas for this location)</em>`;
        $("start").disabled = true;
        status(`No wild encounters: ${slug}`);
        log(`no encounters for ${slug} (404, no siblings)`);
        renderEncounterPanel();
        return;
      }
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    area = await res.json();
    // Use the area's declared parent to fetch sibling areas — robust against
    // any naming convention (north/south, b1f, etc.).
    if (area.location?.url) {
      try {
        const lr = await fetch(area.location.url);
        if (lr.ok) {
          const ld = await lr.json();
          areaSiblings = (ld.areas || []).length > 1
            ? ld.areas.map((a) => ({ name: a.name }))
            : [];
        }
      } catch {}
    }
  } catch (e) {
    status(`Failed to load location-area: ${e.message}`);
    log(`load failed: ${e.message}`);
    return;
  }
  lastAreaData = area;
  $("start").disabled = true;

  // Compute availableMethods for the chosen version: method -> chance-sum.
  availableMethods = new Map();
  for (const enc of area.pokemon_encounters) {
    const vd = enc.version_details.find((v) => v.version.name === version);
    if (!vd) continue;
    for (const ed of vd.encounter_details) {
      availableMethods.set(ed.method.name, (availableMethods.get(ed.method.name) || 0) + ed.chance);
    }
  }

  // If none of the selected methods are available, fall back to whichever
  // method has the most chance-mass for this route+version.
  const validSelected = [...selectedMethods].filter((m) => availableMethods.has(m));
  if (validSelected.length === 0) {
    if (availableMethods.size === 0) {
      encounters = [];
      $("encounters").innerHTML = `<em style="color:var(--muted)">no encounters in ${version} for this area</em>`;
      $("start").disabled = true;
      renderEncounterPanel();
      return;
    }
    const top = [...availableMethods.entries()].sort((a, b) => b[1] - a[1])[0][0];
    selectedMethods = new Set([top]);
    log(`auto-selected method: ${top} (no user-selected method had data)`);
    // Mirror into the legacy <select> for the search-bar / wander code paths.
    $("method").value = top;
  }

  // Merge encounters across all currently-selected methods. Combined-pool
  // weighting: each method's chance contributions sum directly, so denser
  // methods (more entries / higher chances) dominate the combined sample.
  const TIME_VALUES = new Set(["time-morning", "time-day", "time-night"]);
  const tally = new Map();
  for (const enc of area.pokemon_encounters) {
    const vd = enc.version_details.find((v) => v.version.name === version);
    if (!vd) continue;
    let chanceSum = 0;
    for (const ed of vd.encounter_details) {
      if (!selectedMethods.has(ed.method.name)) continue;
      const timeConds = ed.condition_values
        .map((c) => c.name)
        .filter((n) => TIME_VALUES.has(n));
      const matches = band === null || timeConds.length === 0 || timeConds.includes(band);
      if (!matches) continue;
      chanceSum += ed.chance;
    }
    if (chanceSum > 0) {
      tally.set(enc.pokemon.name, {
        name: enc.pokemon.name,
        url: enc.pokemon.url,
        chance: chanceSum,
      });
    }
  }

  if (tally.size === 0) {
    encounters = [];
    $("encounters").innerHTML = `<em style="color:var(--muted)">no encounters for ${version} / ${[...selectedMethods].join("+")} (try other methods)</em>`;
    $("start").disabled = true;
    renderEncounterPanel();
    return;
  }

  status(`Fetching cries for ${tally.size} species...`);
  const list = [...tally.values()];

  // Fetch each pokemon resource for cry URL + sprite.
  await Promise.all(list.map(async (p) => {
    try {
      const r = await fetch(p.url);
      const data = await r.json();
      p.cryUrl = data.cries?.latest || data.cries?.legacy || null;
      // Prefer Gen IV Platinum sprite (fits the route), then DP, then default front.
      const gen4 = data.sprites?.versions?.["generation-iv"];
      p.spriteUrl =
        gen4?.platinum?.front_default ||
        gen4?.["diamond-pearl"]?.front_default ||
        gen4?.["heartgold-soulsilver"]?.front_default ||
        data.sprites?.front_default ||
        null;
    } catch (e) {
      p.cryUrl = null;
      p.spriteUrl = null;
    }
  }));

  encounters = list.filter((p) => p.cryUrl); // sprite is optional, cry is required
  renderTable();
  renderEncounterPanel();
  status(`Loaded ${encounters.length} species.`);
  $("start").disabled = false;
}

function renderTable() {
  const total = encounters.reduce((s, p) => s + p.chance, 0);
  let html = `<table><thead><tr><th>Species</th><th style="text-align:right">Chance</th><th style="text-align:right">Normalized</th></tr></thead><tbody>`;
  for (const p of [...encounters].sort((a, b) => b.chance - a.chance)) {
    const norm = ((p.chance / total) * 100).toFixed(1);
    html += `<tr><td class="species">${p.name}</td><td class="num">${p.chance}</td><td class="num">${norm}%</td></tr>`;
  }
  html += `</tbody></table>`;
  $("encounters").innerHTML = html;
}

// --- Sampling ---

// Exponentially-distributed waiting time, mean = mean.
function expDelay(mean) {
  return -Math.log(1 - Math.random()) * mean;
}

function sampleSpecies() {
  const total = encounters.reduce((s, p) => s + p.chance, 0);
  let r = Math.random() * total;
  for (const p of encounters) {
    r -= p.chance;
    if (r <= 0) return p;
  }
  return encounters[encounters.length - 1];
}

// --- Audio ---

async function playCry(url) {
  // Only play cries once audio has been unlocked. Before that, the call
  // would either no-op (suspended ctx) or worse, get into a bad state.
  if (!audioCtx || audioCtx.state !== "running") return;
  try {
    const res = await fetch(url);
    const buf = await res.arrayBuffer();
    const decoded = await audioCtx.decodeAudioData(buf);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    const volEl = $("vol");
    gain.gain.value = volEl ? parseFloat(volEl.value) : 0.35;
    src.buffer = decoded;
    src.connect(gain).connect(masterGain);
    src.start();
  } catch (e) {
    log(`cry failed: ${e.message}`);
  }
}

// --- Walk loop ---

function scheduleNextStep() {
  if (!walking) return;
  const mean = parseFloat($("stepMean").value);
  const delayMs = expDelay(mean) * 1000;
  walkTimer = setTimeout(async () => {
    if (!walking) return;

    // Encounter roll.
    const p = parseFloat($("encRate").value);
    if (encounters.length > 0 && Math.random() < p) {
      const sp = sampleSpecies();
      log(`encounter: ${sp.name}`);
      playCry(sp.cryUrl);
      popSprite(sp);
    }

    // (Wander is no longer rolled per walk-step; see onBgmLoopComplete.)
    scheduleNextStep();
  }, delayMs);
}

// Internal navigation (used by wander; wraps loadEncounters + loadLocationInfo + BGM).
async function navigateTo(slug) {
  $("slug").value = slug;
  await loadEncounters();
  loadLocationInfo();
  await searchBgm();
  if (walking && bgmBuffer && !bgmSource) startBgm();
}

// Sprite pop-up. Appends an element to #stage at a random horizontal position,
// CSS animation handles entry/bounce/exit, then we remove the node.
// Sprite spawn. In field-guide mode the sprite is positioned via `left` in
// stage-local coords. In immersive mode it carries an image-space coordinate
// (imgX, imgY in the layout's natural pixels) that the pan loop maps to a
// transform each frame, so sprites stay glued to the artwork as you pan.
function popSprite(species) {
  if (!species.spriteUrl) {
    log(`sprite skipped: ${species.name} has no spriteUrl`);
    return;
  }
  const stage = $("stage");
  const immersive = document.body.classList.contains("immersive");
  log(`sprite ${species.name} immersive=${immersive} dims=${_immersiveBgDims ? "set" : "null"}`);
  const inner = document.createElement("div");
  inner.className = "sprite";
  inner.innerHTML = `<img src="${species.spriteUrl}" alt="${species.name}"><span class="sprite-label">${species.name}</span>`;

  let outer; // The element appended to #stage. In immersive, it's a wrapper
             // holding the position translate so the entry animation on .sprite
             // doesn't clobber it.
  if (immersive && _immersiveBgDims) {
    const vw = window.innerWidth, vh = window.innerHeight;
    const margin = 80;
    const vx = margin + Math.random() * Math.max(0, vw - 2 * margin);
    const vy = vh * 0.55 + Math.random() * (vh * 0.30); // lower 55-85% of viewport
    const imgX = -_panX + vx;
    const imgY = -_panY + vy;
    outer = document.createElement("div");
    outer.className = "sprite-pos";
    outer.dataset.imgX = imgX;
    outer.dataset.imgY = imgY;
    outer.style.setProperty("--sx", `${vx - 48}px`);
    outer.style.setProperty("--sy", `${vy - 48}px`);
    outer.appendChild(inner);
  } else {
    // Field-guide: random horizontal in the stage strip; sprite directly.
    const sw = stage.clientWidth || 600;
    const margin = 60;
    const x = Math.max(margin, Math.min(sw - margin, margin + Math.random() * (sw - 2 * margin))) - 48;
    inner.style.left = `${x}px`;
    outer = inner;
  }
  stage.appendChild(outer);
  // Flash the minimap so the user sees the dot pulse in (good for diagnosing
  // "are sprites even spawning?" without panning).
  if (immersive && _immersiveBgDims) showMinimap();
  setTimeout(() => {
    outer.classList.add("fading");
    setTimeout(() => outer.remove(), 500);
  }, SPRITE_LIFETIME_MS);
}


function startWalk() {
  if (encounters.length === 0) { status("Load encounters first."); return; }
  ensureAudio();
  // AudioContext is suspended until a user gesture — startWalk is a click, so resume here.
  if (audioCtx.state === "suspended") audioCtx.resume();
  walking = true;
  $("start").disabled = true;
  $("stop").disabled = false;
  status("Walking...");
  log("started walking");
  startBgm();
  scheduleNextStep();
}

function stopWalk() {
  walking = false;
  if (walkTimer) clearTimeout(walkTimer);
  walkTimer = null;
  $("start").disabled = encounters.length === 0;
  $("stop").disabled = true;
  stopBgm();
  status("Stopped.");
  log("stopped");
}

function startBgm(offsetSec) {
  if (!bgmBuffer) return; // no track loaded
  if (bgmSource) return;  // already playing
  // Audio context must exist *and* be running — the user must have gestured.
  // Without this check we silently call src.start() on a suspended context,
  // which Chrome ignores and then logs autoplay-policy noise.
  if (!audioCtx || audioCtx.state !== "running") return;
  const offset = (offsetSec != null && Number.isFinite(offsetSec)) ? offsetSec : 0;
  bgmSource = audioCtx.createBufferSource();
  bgmSource.buffer = bgmBuffer;
  bgmSource.loop = true;
  bgmSource.connect(bgmGain);
  bgmSource.start(0, offset);
  bgmStartedAt = audioCtx.currentTime;
  _playerSeekOffset = offset;
  _playerStartedAt = audioCtx.currentTime;
  // New playback session = reset loop tracker. The loop count counts full
  // wraparounds since this start; offset != 0 means a seek, so we don't
  // pretend we just started fresh.
  _bgmLastPos = offset;
  _bgmLoopCount = 0;
  $("playerToggle").textContent = "⏸";
}

function stopBgm() {
  if (!bgmSource) return;
  try { bgmSource.stop(); } catch {}
  bgmSource.disconnect();
  bgmSource = null;
  $("playerToggle").textContent = "▶";
}

// --- BGM (khinsider via proxy) ---

// Content-addressed mp3-url cache: trackTitle -> mp3Url. Keyed only on the
// album track title (which uniquely identifies a song), so it's immune to slug
// races and survives across locations that share a theme.
const MP3_CACHE_KEY = "mp3Cache:v1";
function loadMp3Cache() {
  try { return JSON.parse(localStorage.getItem(MP3_CACHE_KEY)) || {}; }
  catch { return {}; }
}
function saveMp3Cache(c) { localStorage.setItem(MP3_CACHE_KEY, JSON.stringify(c)); }

// Resolve the user-effective time band (auto -> map to local tz -> day/morning/night).
function effectiveTimeBand() {
  const choice = $("tod").value;
  if (choice === "auto") {
    const b = localTimeBand(); // "time-morning" | "time-day" | "time-night"
    return b.replace(/^time-/, "");
  }
  if (choice === "any") return null;
  return choice.replace(/^time-/, "");
}

async function searchBgm() {
  const slug = $("slug").value.trim();
  const version = $("version").value;
  const proxy = $("proxy").value.trim().replace(/\/$/, "");
  const tb = effectiveTimeBand();
  status(`Searching BGM for ${slug} (${version}${tb ? ", " + tb : ""})...`);
  let data;
  try {
    const url = `${proxy}/bgm/search?slug=${encodeURIComponent(slug)}&version=${version}${tb ? "&timeBand=" + tb : ""}`;
    const res = await fetch(url);
    data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  } catch (e) {
    status(`BGM search failed: ${e.message}`);
    log(`bgm search failed: ${e.message}`);
    return;
  }
  // Render the resolution trace regardless of whether we got candidates.
  renderBgmTrace(slug, version, tb, data);

  if (!data.candidates || data.candidates.length === 0) {
    status(`No BGM candidates for ${slug}.`);
    $("bgmPicker").innerHTML = `<em>No matches in album ${data.album}.</em>`;
    return;
  }
  log(`bgm: ${data.candidates.length} candidates from ${data.album}`);

  // Render picker.
  const opts = data.candidates.map((c, i) =>
    `<option value="${i}">${c.title} (score ${c.score})</option>`
  ).join("");
  $("bgmPicker").innerHTML = `
    <label>Pick track:
      <select id="bgmSelect">${opts}</select>
    </label>
    <button id="bgmPick">Use this track</button>
  `;
  // Stash candidates for the pick handler + the bottom-right player.
  window._bgmCandidates = data.candidates;
  _playerCandidates = data.candidates;

  $("bgmPick").addEventListener("click", () => {
    const idx = parseInt($("bgmSelect").value, 10);
    pickBgm(window._bgmCandidates[idx]);
  });

  // Auto-pick top candidate.
  pickBgm(data.candidates[0]);
}

// Render the slug -> Bulbapedia row -> track title -> album candidates -> picked
// resolution chain in the sidebar so the reasoning is visible.
function renderBgmTrace(slug, version, timeBand, data) {
  const trace = data.bulbaTrace || {};
  const picked = data.candidates?.[0];
  const escape = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  // Step 1: input. Step 2: Bulbapedia. Step 3: chosen track title. Step 4: album match.
  let html = `<div class="trace">`;
  html += `<div class="step"><span class="label">input</span><span class="val">${escape(slug)} · ${escape(version)} · ${escape(timeBand || "any")}</span></div>`;

  if (trace.error) {
    html += `<div class="step"><span class="arrow">↓</span><span class="label">bulba</span><span class="val error">${escape(trace.error)}</span></div>`;
  } else if (trace.allRows && trace.allRows.length > 0) {
    const matched = trace.matchedRow;
    html += `<div class="step"><span class="arrow">↓</span><span class="label">bulba</span><span class="val">page: ${escape(trace.title)}</span></div>`;
    if (matched) {
      html += `<div class="step"><span class="arrow">↓</span><span class="label">row</span><span class="val picked">[${matched.games.join(",")}] ${escape(matched.situation || "—")} → "${escape(matched.trackTitle)}"</span></div>`;
      html += `<div class="step"><span class="arrow">·</span><span class="label">why</span><span class="val">${escape(trace.pickReason)}</span></div>`;
    }
    if (trace.allRows.length > 1) {
      html += `<details><summary>all ${trace.allRows.length} music rows on Bulbapedia</summary>`;
      for (const r of trace.allRows) {
        const isPicked = matched && r.trackTitle === matched.trackTitle && r.situation === matched.situation;
        html += `<div class="row${isPicked ? " picked" : ""}">[${r.games.join(",")}] ${escape(r.situation || "—")} → "${escape(r.trackTitle)}"</div>`;
      }
      html += `</details>`;
    }
  } else {
    html += `<div class="step"><span class="arrow">↓</span><span class="label">bulba</span><span class="val error">${escape(trace.pickReason || "no music section parsed; falling back to slug tokens")}</span></div>`;
    html += `<div class="step"><span class="arrow">↓</span><span class="label">tokens</span><span class="val">${escape((data.tokens || []).join(" "))}</span></div>`;
  }

  if (picked) {
    html += `<div class="step"><span class="arrow">↓</span><span class="label">album</span><span class="val">${escape(data.album)}</span></div>`;
    html += `<div class="step"><span class="arrow">↓</span><span class="label">picked</span><span class="val picked">${escape(picked.title)} (score ${picked.score})</span></div>`;
    if (data.candidates.length > 1) {
      html += `<details><summary>other candidates (${data.candidates.length - 1})</summary>`;
      for (const c of data.candidates.slice(1)) {
        html += `<div class="row">${escape(c.title)} (score ${c.score})</div>`;
      }
      html += `</details>`;
    }
  } else {
    html += `<div class="step"><span class="arrow">↓</span><span class="label">album</span><span class="val error">no candidates matched</span></div>`;
  }
  html += `</div>`;
  $("bgmTrace").innerHTML = html;
}

// Fetch + decode an MP3 into bgmBuffer. If audio hasn't been unlocked yet
// (no user gesture), stash the raw bytes; the gesture handler will decode
// + start them. This is the Chrome autoplay-policy compliant path: don't
// touch AudioContext until we're inside a user-gesture event.
async function loadBgmBuffer(mp3Url) {
  const proxy = $("proxy").value.trim().replace(/\/$/, "");
  const streamUrl = `${proxy}/bgm/stream?url=${encodeURIComponent(mp3Url)}`;
  const res = await fetch(streamUrl);
  if (!res.ok) throw new Error(`stream HTTP ${res.status}`);
  const buf = await res.arrayBuffer();
  if (!audioCtx) {
    // No audio context yet → user hasn't gestured. Defer the decode.
    _pendingBgmBytes = { mp3Url, bytes: buf };
    log(`bgm bytes pending; click or press a key to start`);
    return;
  }
  bgmBuffer = await audioCtx.decodeAudioData(buf);
}

async function pickBgm(candidate) {
  const proxy = $("proxy").value.trim().replace(/\/$/, "");
  // Content-addressed cache lookup: have we resolved this exact track before?
  const cache = loadMp3Cache();
  let mp3Url = cache[candidate.title];
  if (mp3Url) {
    log(`bgm cache hit: ${candidate.title}`);
  } else {
    status(`Resolving "${candidate.title}"...`);
    try {
      const res = await fetch(`${proxy}/bgm/resolve?trackUrl=${encodeURIComponent(candidate.trackUrl)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      mp3Url = data.mp3Url;
      cache[candidate.title] = mp3Url;
      saveMp3Cache(cache);
    } catch (e) {
      status(`BGM resolve failed: ${e.message}`);
      log(`bgm resolve failed: ${e.message}`);
      return;
    }
  }
  status(`Decoding "${candidate.title}"...`);
  try {
    stopBgm();
    await loadBgmBuffer(mp3Url);
    // If audio has been unlocked (user has interacted) OR we're currently
    // walking, start the new buffer. Otherwise wait for the gesture handler.
    if (_audioUnlocked || walking) startBgm();
  } catch (e) {
    status(`BGM decode failed: ${e.message}`);
    log(`bgm decode failed: ${e.message}`);
    return;
  }
  setBgmStatus(`▶ ${candidate.title}`);
  status(`BGM ready: ${candidate.title}`);
  log(`bgm picked: ${candidate.title}`);
  $("changeBgm").disabled = false;
  _playerCurrent = candidate;
  refreshPlayer();
}

// --- Bulbapedia location info ---

// Cache of image natural dimensions, keyed by URL. Probing each layout image
// once tells us whose layout is "bigger" so we can pick the more-detailed one
// when both Bulbapedia and Serebii offer this version.
const _imgDimsCache = new Map();
function probeImageDims(url) {
  if (_imgDimsCache.has(url)) return Promise.resolve(_imgDimsCache.get(url));
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const dims = { w: img.naturalWidth, h: img.naturalHeight };
      _imgDimsCache.set(url, dims);
      resolve(dims);
    };
    img.onerror = () => {
      _imgDimsCache.set(url, { w: 0, h: 0 });
      resolve({ w: 0, h: 0 });
    };
    img.src = url;
  });
}

// Pick whichever source's layouts are bigger (by total pixel area summed
// across all variants for the requested version). Either side may be empty.
async function pickBestLayouts(aLayouts, bLayouts, version, proxy) {
  const aVar = aLayouts?.[version] || (aLayouts ? Object.values(aLayouts)[0] : null);
  const bVar = bLayouts?.[version] || (bLayouts ? Object.values(bLayouts)[0] : null);
  if (!aVar?.length && !bVar?.length) return aLayouts || bLayouts || {};
  if (!aVar?.length) return bLayouts;
  if (!bVar?.length) return aLayouts;

  const measure = async (variants) => {
    let total = 0;
    for (const v of variants) {
      const url = `${proxy}/location/image?url=${encodeURIComponent(v.url)}`;
      const dims = await probeImageDims(url);
      total += dims.w * dims.h;
    }
    return total;
  };
  const [aArea, bArea] = await Promise.all([measure(aVar), measure(bVar)]);
  log(`layouts: a=${aArea}px² b=${bArea}px² → ${aArea >= bArea ? "a" : "b"}`);
  return aArea >= bArea ? aLayouts : bLayouts;
}

// Fetch a location's info from one of the two sources. Bulbapedia is the
// canonical source for connections + music; Serebii's structured /pokearth/
// pages are the fallback for layouts and maps when Bulbapedia comes up empty.
async function fetchLocationInfo(source, slug, version, proxy) {
  const endpoint = source === "serebii" ? "/location/info/serebii" : "/location/info";
  const res = await fetch(`${proxy}${endpoint}?slug=${encodeURIComponent(slug)}&version=${version}`);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function loadLocationInfo() {
  const slug = $("slug").value.trim();
  const version = $("version").value;
  const proxy = $("proxy").value.trim().replace(/\/$/, "");
  const primary = $("primarySource")?.value || "bulbapedia";
  const secondary = primary === "bulbapedia" ? "serebii" : "bulbapedia";
  const fallbackOn = $("fallbackEnabled")?.checked ?? true;

  // Fetch primary + secondary in parallel so the merge below is fast. Either
  // can fail; the merge tolerates partial responses.
  const [primaryData, secondaryData] = await Promise.all([
    fetchLocationInfo(primary, slug, version, proxy).catch((e) => {
      log(`primary (${primary}) failed: ${e.message}`);
      return null;
    }),
    fallbackOn ? fetchLocationInfo(secondary, slug, version, proxy).catch((e) => {
      log(`secondary (${secondary}) failed: ${e.message}`);
      return null;
    }) : Promise.resolve(null),
  ]);

  if (!primaryData && !secondaryData) {
    $("locationPanel").style.display = "none";
    return;
  }

  // Merge with field-specific source preferences:
  // - mapImageUrl: always Bulbapedia (Serebii's regional map is gen-specific
  //   and doesn't show "where in the region you are" the same way).
  // - layouts: primary, then secondary if primary has none.
  // - connections: primary, then secondary if primary has none. Serebii's
  //   connections are well-tagged with directions, so they're a strong fallback
  //   for Bulbapedia's prose-based "near" connections.
  // - music + title: Bulbapedia only (Serebii doesn't structurally expose them).
  const bulba = primary === "bulbapedia" ? primaryData : secondaryData;
  const sere  = primary === "serebii"    ? primaryData : secondaryData;
  // Layout merge: when both sources offer layouts for this version, pick
  // whichever has the larger natural pixel area. Tendency: Bulbapedia is
  // bigger for cities (full overworld map), Serebii is bigger for routes
  // (per-floor gameplay map). Don't hardcode either preference; compare.
  const layouts = await pickBestLayouts(primaryData?.layouts, secondaryData?.layouts, version, proxy);

  const data = {
    title: (bulba?.title) || (primaryData?.title) || slug,
    mapImageUrl: bulba?.mapImageUrl || null,
    layouts,
    connections: (primaryData?.connections && primaryData.connections.length > 0)
      ? primaryData.connections
      : (secondaryData?.connections || []),
    music: bulba?.music || [],
  };
  if (data.connections !== primaryData?.connections && data.connections.length > 0) {
    log(`connections filled from ${secondary}`);
  }

  $("locationPanel").style.display = "";
  // Connections
  currentConnections = data.connections || [];
  const cont = $("connections");
  cont.innerHTML = "";
  const arrowFor = (d) => ({ west: "←", east: "→", north: "↑", south: "↓", near: "≈" })[d] || "•";
  for (const c of data.connections) {
    const btn = document.createElement("button");
    btn.textContent = `${arrowFor(c.direction)} ${c.name}`;
    btn.title = c.slug;
    btn.addEventListener("click", () => {
      _arrivalFrom = oppositeDir(c.direction);
      $("slug").value = c.slug;
      $("load").click();
    });
    cont.appendChild(btn);
  }
  if (data.connections.length === 0) {
    cont.innerHTML = `<small style="color:var(--muted)">no connecting locations parsed</small>`;
  }

  // Map image + highlight
  const mapImg = $("locationMap");
  $("mapCaption").textContent = `Location of ${data.title.replace(/_/g, " ")} in Sinnoh.`;
  if (data.mapImageUrl) {
    // Stream through proxy for CORS so we can read pixels.
    mapImg.crossOrigin = "anonymous";
    mapImg.src = `${proxy}/location/image?url=${encodeURIComponent(data.mapImageUrl)}`;
    mapImg.onload = () => detectHighlight(mapImg, data.title);
    mapImg.style.display = "";
  } else {
    mapImg.removeAttribute("src");
    mapImg.style.display = "none";
    $("locationOverlay").innerHTML = "";
  }

  // Layout: each version maps to an array of variants ({ label, url }), so a
  // page like Eterna Forest can have separate "exterior" and "interior" layouts
  // for the same game. Render a small variant pill row when there's >1.
  // (`version` already declared at top of function.)
  const layoutImg = $("layoutImg");
  const layoutCap = $("layoutCaption");
  const layoutPanel = $("layoutPanel");
  // Normalize: old shape was a string per version; new shape is an array.
  const variantsForVersion = (() => {
    const v = data.layouts && (data.layouts[version] || Object.values(data.layouts)[0]);
    if (!v) return [];
    return Array.isArray(v) ? v : [{ label: "main", url: v }];
  })();
  if (variantsForVersion.length > 0) {
    const usedVersion = data.layouts[version] ? version : Object.keys(data.layouts)[0];
    let activeIdx = 0;
    const renderVariant = (idx) => {
      const variant = variantsForVersion[idx];
      layoutImg.src = `${proxy}/location/image?url=${encodeURIComponent(variant.url)}`;
      layoutImg.style.display = "";
      // Caption + variant pills.
      let pills = "";
      if (variantsForVersion.length > 1) {
        pills = `<div class="layout-variants">` + variantsForVersion.map((v, i) =>
          `<button class="layout-variant${i === idx ? " active" : ""}" data-idx="${i}">${v.label}</button>`
        ).join("") + `</div>`;
      }
      layoutCap.innerHTML = `Layout (${usedVersion}, ${variant.label}).` + pills;
      layoutCap.style.display = "";
      layoutCap.querySelectorAll(".layout-variant").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeIdx = parseInt(btn.dataset.idx, 10);
          renderVariant(activeIdx);
          // Refresh immersive bg too, since the layout image changed.
          $("layoutImg").addEventListener("load", refreshImmersiveBg, { once: true });
        });
      });
    };
    renderVariant(activeIdx);
    layoutPanel.style.display = "";
  } else {
    layoutImg.removeAttribute("src");
    layoutImg.style.display = "none";
    layoutCap.style.display = "none";
    layoutPanel.style.display = "none";
  }

  // Update route title in the header.
  const displayName = data.title.replace(/_/g, " ");
  $("routeTitle").textContent = displayName;
  $("routeSub").textContent = `${$("version").value} · ${$("tod").value === "auto" ? "auto" : $("tod").value.replace("time-", "")}`;

  // Immersive-mode refreshes: bg image, edge connections, caption.
  // The bg uses the image *URL* not its decoded pixels, so we don't need to
  // wait for the image to load — set immediately, browser will fill in.
  refreshImmersiveBg();
  // Re-run once images finish loading too, in case the src was set after the
  // call above (rare but safe).
  $("layoutImg").addEventListener("load", refreshImmersiveBg, { once: true });
  $("locationMap").addEventListener("load", refreshImmersiveBg, { once: true });
  renderEdgeZones(currentConnections);
  updateCaption();
}

// Detect the highlighted region on a Bulbapedia location map.
// Bulbapedia uses a cyan/pale-cyan to mark the current location. We find
// pixels matching that hue and compute their bounding box, then draw an
// SVG rect overlay (single hotspot — fine for v1; can upgrade to convex hull later).
function detectHighlight(img, title) {
  const overlay = $("locationOverlay");
  overlay.innerHTML = "";
  // viewBox matches image natural size so we can use pixel coords directly.
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return;
  overlay.setAttribute("viewBox", `0 0 ${w} ${h}`);

  // Draw to canvas to read pixels.
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  let data;
  try {
    ctx.drawImage(img, 0, 0);
    data = ctx.getImageData(0, 0, w, h).data;
  } catch (e) {
    log(`highlight detect: canvas tainted (${e.message})`);
    return;
  }

  // Bulbapedia highlight is pale cyan. Match: high B, high G, low-ish R, R<G,B.
  // Be permissive: r<200, g>180, b>180, b>=g-20, b-r > 30.
  let minX = w, minY = h, maxX = 0, maxY = 0, count = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      if (r < 200 && g > 180 && b > 180 && (b - r) > 30) {
        count++;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (count < 4) {
    log(`highlight detect: no cyan pixels found for ${title}`);
    return;
  }
  // Pad slightly.
  const pad = 2;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("x", minX);
  rect.setAttribute("y", minY);
  rect.setAttribute("width", maxX - minX);
  rect.setAttribute("height", maxY - minY);
  rect.setAttribute("rx", "2");
  rect.style.stroke = "rgba(90,122,61,0.7)";
  rect.style.strokeWidth = "1";
  rect.addEventListener("click", () => {
    log(`clicked highlight for ${title}`);
  });
  overlay.appendChild(rect);
  log(`highlight: ${count} px, bbox ${minX},${minY} ${maxX-minX}x${maxY-minY}`);
}

// --- Region master map (Sinnoh) ---
//
// Strategy: enumerate Sinnoh locations from PokéAPI. For each, ask the proxy for
// its Bulbapedia map URL, load through CORS proxy, detect cyan highlight bbox.
// Cache per slug in localStorage. Render all bboxes as clickable rects on a shared
// base map (we use the first successfully-fetched map as the base — they share the
// same base layer; the highlight is just an overlay).

const REGION_KEY = "region:sinnoh:v1";

function loadRegionCache() {
  try { return JSON.parse(localStorage.getItem(REGION_KEY)) || {}; }
  catch { return {}; }
}
function saveRegionCache(c) { localStorage.setItem(REGION_KEY, JSON.stringify(c)); }

async function discoverSinnohSlugs() {
  // /region/sinnoh -> locations[].url -> each location -> areas[].name
  const r = await fetch(`${POKEAPI}/region/sinnoh`);
  const region = await r.json();
  const slugs = [];
  await Promise.all(region.locations.map(async (loc) => {
    try {
      const lr = await fetch(loc.url);
      const ld = await lr.json();
      for (const a of ld.areas) slugs.push({ slug: a.name, locationName: ld.name });
    } catch {}
  }));
  return slugs;
}

// Detect cyan highlight in an Image, return {x,y,w,h} in image-pixel coords or null.
function detectHighlightFromImage(img) {
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) return null;
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0);
  let data;
  try { data = ctx.getImageData(0, 0, w, h).data; }
  catch { return null; }
  let minX = w, minY = h, maxX = 0, maxY = 0, count = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      if (r < 200 && g > 180 && b > 180 && (b - r) > 30) {
        count++;
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (count < 4) return null;
  return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1, naturalW: w, naturalH: h };
}

async function fetchHighlightForSlug(slug, proxy) {
  // 1) Get Bulbapedia map URL via proxy.
  const infoRes = await fetch(`${proxy}/location/info?slug=${encodeURIComponent(slug)}`);
  const info = await infoRes.json();
  if (!info.mapImageUrl) return null;
  // 2) Load image through proxy for CORS.
  const img = new Image();
  img.crossOrigin = "anonymous";
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = `${proxy}/location/image?url=${encodeURIComponent(info.mapImageUrl)}`;
  });
  const hl = detectHighlightFromImage(img);
  if (!hl) return null;
  return { ...hl, mapImageUrl: info.mapImageUrl, name: slug.replace(/-area$/, "").replace(/-/g, " ") };
}

async function buildRegion() {
  const proxy = $("proxy").value.trim().replace(/\/$/, "");
  $("regionStatus").textContent = "discovering...";
  const slugInfos = await discoverSinnohSlugs();
  $("regionStatus").textContent = `${slugInfos.length} areas; fetching highlights...`;
  const cache = loadRegionCache();
  let baseMapUrl = null;
  let done = 0;

  // Sequential to be polite to the proxy + Bulbapedia.
  for (const { slug, locationName } of slugInfos) {
    if (cache[slug]) {
      done++;
      if (!baseMapUrl) baseMapUrl = cache[slug].mapImageUrl;
      continue;
    }
    try {
      const hl = await fetchHighlightForSlug(slug, proxy);
      if (hl) {
        hl.locationName = locationName;
        cache[slug] = hl;
        if (!baseMapUrl) baseMapUrl = hl.mapImageUrl;
        saveRegionCache(cache);
      }
    } catch (e) {
      log(`region: ${slug} failed: ${e.message}`);
    }
    done++;
    $("regionStatus").textContent = `${done}/${slugInfos.length} (${Object.keys(cache).length} highlights)`;
  }
  $("regionStatus").textContent = `done: ${Object.keys(cache).length} clickable regions`;
  renderRegion();
}

function renderRegion() {
  const cache = loadRegionCache();
  const entries = Object.entries(cache);
  if (entries.length === 0) {
    $("regionMapWrap").style.display = "none";
    $("regionCaption").style.display = "none";
    return;
  }
  $("regionMapWrap").style.display = "";
  $("regionCaption").style.display = "";
  const proxy = $("proxy").value.trim().replace(/\/$/, "");
  // Use any cached map as the base — the base layer is identical for every Sinnoh location map.
  const baseUrl = entries[0][1].mapImageUrl;
  const img = $("regionMap");
  img.src = `${proxy}/location/image?url=${encodeURIComponent(baseUrl)}`;
  const overlay = $("regionOverlay");
  // Use the first entry's natural dims for viewBox (all maps share dims).
  const { naturalW, naturalH } = entries[0][1];
  overlay.setAttribute("viewBox", `0 0 ${naturalW} ${naturalH}`);
  overlay.innerHTML = "";
  const currentSlug = $("slug").value.trim();
  for (const [slug, hl] of entries) {
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", hl.x);
    rect.setAttribute("y", hl.y);
    rect.setAttribute("width", hl.w);
    rect.setAttribute("height", hl.h);
    rect.setAttribute("rx", "1.5");
    if (slug === currentSlug) rect.classList.add("current");
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = hl.name + (hl.locationName && hl.locationName !== hl.name ? ` (${hl.locationName})` : "");
    rect.appendChild(title);
    rect.addEventListener("click", () => {
      $("slug").value = slug;
      $("load").click();
    });
    overlay.appendChild(rect);
  }
}

// Region/master-map UI removed for now — clicking around via per-location
// connections is the navigation mode. The functions above are kept dormant
// so we can wire it back later without re-deriving anything.

// --- Region / Location / Area cascading picker (PokéAPI list endpoints) ---
//
// /region                -> { results: [{name, url}, ...] }
// /region/<name>         -> { locations: [{name, url}, ...] }
// /location/<name>       -> { areas: [{name, url}, ...] }
//
// Areas are what we actually load (their .name is the location-area slug).

// Region -> versions, in chronological order. Hand-curated; covers everything we
// have BGM albums for. PokéAPI's /region/<r>.version_groups gives us this too,
// but the values are version-group slugs ("ruby-sapphire") not individual versions
// and we'd need a second fetch to expand. Hardcoding is faster and more honest.
const REGION_VERSIONS = {
  kanto: ["red", "blue", "yellow", "firered", "leafgreen"],
  johto: ["gold", "silver", "crystal", "heartgold", "soulsilver"],
  hoenn: ["ruby", "sapphire", "emerald", "omega-ruby", "alpha-sapphire"],
  sinnoh: ["diamond", "pearl", "platinum"],
  unova: ["black", "white", "black-2", "white-2"],
  kalos: ["x", "y"],
};

function fillVersions(region) {
  const sel = $("version");
  const prev = sel.value;
  sel.innerHTML = "";
  const versions = REGION_VERSIONS[region] || [];
  if (versions.length === 0) {
    const opt = document.createElement("option");
    opt.value = ""; opt.textContent = "(unsupported region)";
    sel.appendChild(opt);
    return;
  }
  for (const v of versions) {
    const opt = document.createElement("option");
    opt.value = v;
    opt.textContent = v.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    sel.appendChild(opt);
  }
  // Restore previous selection if still valid; else pick the last (latest) version.
  if (versions.includes(prev)) sel.value = prev;
  else sel.value = versions[versions.length - 1];
}

// --- Search index (fzf-style across regions/locations/areas) ---
//
// Index entries: { slug, region, locationName, areaName, display }.
// Built once per region from PokéAPI (region -> locations -> areas), cached in
// localStorage. The user types into a single search bar; we tokenize the query
// (with `/` as a stronger separator), require every token to substring-match
// the display, and rank by word-start hits and tightness.

const SEARCH_INDEX_KEY = "searchIndex:v2"; // bumped: rows now include game version
const SEARCH_REGIONS = Object.keys(REGION_VERSIONS); // kanto/johto/hoenn/sinnoh/unova/kalos

let searchIndex = []; // [{slug, region, locationName, areaName, display, displayLower}]

function loadSearchIndex() {
  try {
    const cached = JSON.parse(localStorage.getItem(SEARCH_INDEX_KEY));
    if (Array.isArray(cached) && cached.length > 0) {
      searchIndex = cached;
      return true;
    }
  } catch {}
  return false;
}

async function buildSearchIndex() {
  log("building search index...");
  const out = [];
  for (const region of SEARCH_REGIONS) {
    try {
      const r = await fetch(`${POKEAPI}/region/${region}`);
      const region_data = await r.json();
      const locations = await Promise.all(region_data.locations.map(async (loc) => {
        try {
          const lr = await fetch(loc.url);
          return await lr.json();
        } catch { return null; }
      }));
      const versions = REGION_VERSIONS[region] || [];
      for (const loc of locations) {
        if (!loc || !loc.areas) continue;
        const locName = loc.name;
        for (const area of loc.areas) {
          const areaName = area.name.replace(new RegExp(`^${locName}-?`), "").replace(/-area$/, "") || "main";
          // Emit one row per game version available in this region. This is
          // optimistic — some (region × version × area) combos have no PokéAPI
          // encounter data, surfaced via the empty-table diagnostic on Load.
          for (const version of versions) {
            const display = `${region} / ${version} / ${locName.replace(/-/g, " ")} / ${areaName.replace(/-/g, " ")}`;
            out.push({
              slug: area.name,
              region,
              version,
              locationName: locName,
              areaName,
              display,
              displayLower: display.toLowerCase(),
            });
          }
        }
      }
    } catch (e) {
      log(`region ${region} index failed: ${e.message}`);
    }
  }
  searchIndex = out;
  localStorage.setItem(SEARCH_INDEX_KEY, JSON.stringify(out));
  log(`search index: ${out.length} entries`);
}

function searchScore(displayLower, queryTokens) {
  let score = 0;
  let lastIdx = -1;
  for (const tok of queryTokens) {
    const idx = displayLower.indexOf(tok);
    if (idx < 0) return -Infinity; // every token must appear
    // Word-start bonus.
    if (idx === 0 || /[\s/]/.test(displayLower[idx - 1])) score += 5;
    else score += 1;
    // Contiguous bonus: this token starts after the previous one ended (within a few chars).
    if (lastIdx >= 0 && idx - lastIdx < tok.length + 8) score += 2;
    lastIdx = idx + tok.length;
  }
  // Shorter display = more specific = slight bump.
  score -= displayLower.length * 0.01;
  return score;
}

function runSearch(query) {
  if (!query.trim()) return [];
  // Tokenize on whitespace and `/`; lowercase.
  const tokens = query.toLowerCase().split(/[\s/]+/).filter(Boolean);
  if (tokens.length === 0) return [];
  return searchIndex
    .map((e) => ({ entry: e, score: searchScore(e.displayLower, tokens) }))
    .filter((r) => r.score > -Infinity)
    .sort((a, b) => b.score - a.score)
    .slice(0, 12);
}

function renderSearchResults(results) {
  const cont = $("searchResults");
  if (results.length === 0) { cont.classList.remove("open"); cont.innerHTML = ""; return; }
  cont.innerHTML = results.map((r, i) => {
    const e = r.entry;
    return `<div class="result" data-idx="${i}" data-slug="${e.slug}" data-version="${e.version}" data-region="${e.region}">
      <span class="tag">${e.region} / ${e.version}</span>
      <span>${e.locationName.replace(/-/g, " ")}</span>
      ${e.areaName !== "main" ? `<span class="area"> / ${e.areaName.replace(/-/g, " ")}</span>` : ""}
    </div>`;
  }).join("");
  cont.classList.add("open");
}

let searchActive = -1;
function setSearchActive(idx) {
  const results = $("searchResults").querySelectorAll(".result");
  if (results.length === 0) return;
  searchActive = (idx + results.length) % results.length;
  results.forEach((el, i) => el.classList.toggle("active", i === searchActive));
  results[searchActive].scrollIntoView({ block: "nearest" });
}

function pickSearchResult(slug, version) {
  // Region inferred from version; we set the version dropdown to the chosen
  // game (e.g. "emerald") and the slug to the area. Version dropdown options
  // are populated for the entry's region so the value is valid.
  const entry = searchIndex.find((e) => e.slug === slug && e.version === version);
  if (!entry) return;
  fillVersions(entry.region);
  $("version").value = entry.version;
  $("slug").value = slug;
  $("searchInput").value = "";
  $("searchResults").classList.remove("open");
  searchActive = -1;
  $("load").click();
}

$("searchInput").addEventListener("input", (e) => {
  const results = runSearch(e.target.value);
  renderSearchResults(results);
  searchActive = -1;
});

$("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); setSearchActive(searchActive + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setSearchActive(searchActive - 1); }
  else if (e.key === "Enter") {
    const results = $("searchResults").querySelectorAll(".result");
    const target = searchActive >= 0 ? results[searchActive] : results[0];
    if (target) pickSearchResult(target.dataset.slug, target.dataset.version);
  } else if (e.key === "Escape") {
    $("searchResults").classList.remove("open");
  }
});

$("searchResults").addEventListener("click", (e) => {
  const r = e.target.closest(".result");
  if (r) pickSearchResult(r.dataset.slug, r.dataset.version);
});

document.addEventListener("click", (e) => {
  if (!$("searchWrap").contains(e.target)) {
    $("searchResults").classList.remove("open");
  }
});

// Bootstrap: load cached index, build if empty.
if (!loadSearchIndex()) {
  buildSearchIndex();
}

fillVersions("sinnoh"); // page default slug is sinnoh-route-201-area

  const el1 = $("bgmStatus"); if (el1) el1.textContent = text;
  const el2 = $("bgmStatusSidebar"); if (el2) el2.textContent = text;
}

// Hamburger / sidebar toggle.
$("hamburger").addEventListener("click", () => {
  $("sidebar").classList.toggle("open");
});

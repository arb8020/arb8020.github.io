// Browsers block AudioContext until a user gesture. On the first click or
// keypress anywhere, resume the context and start whatever buffer is loaded.
// One-shot: after this, normal startBgm calls work without prompt.
// Console helper: type debugAudio() to see why music isn't playing.
window.debugWalk = () => {
  const summary = {
    walking,
    encounters: encounters.length,
    audioCtxState: audioCtx?.state,
    immersive: document.body.classList.contains("immersive"),
    immersiveBgDims: _immersiveBgDims,
    spritesOnStage: $("stage").querySelectorAll(".sprite, .sprite-pos").length,
    encRate: parseFloat($("encRate").value),
    stepMean: parseFloat($("stepMean").value),
  };
  console.table(summary);
  return summary;
};
window.debugAudio = () => {
  const summary = {
    audioCtxState: audioCtx?.state ?? "(not created)",
    audioUnlocked: _audioUnlocked,
    pendingBgmBytes: _pendingBgmBytes ? `${(_pendingBgmBytes.bytes.byteLength / 1024).toFixed(1)} KB pending` : null,
    bgmBuffer: bgmBuffer ? `AudioBuffer ${bgmBuffer.duration.toFixed(1)}s` : null,
    bgmSource: bgmSource ? "playing" : null,
    walking,
    bgmStatus: $("bgmStatusSidebar")?.textContent,
  };
  console.table(summary);
  return summary;
};

async function unlockAudioOnGesture() {
  if (_audioUnlocked) return;
  _audioUnlocked = true;
  // Create the AudioContext now, inside the gesture handler. Chrome considers
  // contexts created during a gesture as "allowed to start" — distinct from
  // contexts created earlier programmatically.
  ensureAudio();
  if (audioCtx.state === "suspended") {
    try { await audioCtx.resume(); } catch (e) { log(`audio resume failed: ${e.message}`); }
  }
  // Decode any pending BGM bytes that were stashed before the gesture.
  if (_pendingBgmBytes) {
    try {
      bgmBuffer = await audioCtx.decodeAudioData(_pendingBgmBytes.bytes);
      log(`decoded pending bgm bytes (${bgmBuffer.duration.toFixed(1)}s)`);
    } catch (e) {
      log(`pending bgm decode failed: ${e.message}`);
    }
    _pendingBgmBytes = null;
  }
  // Start the buffer if one is loaded.
  if (bgmBuffer && !bgmSource) startBgm();
  // Auto-start the walk loop once audio is unlocked. Music + encounters are
  // unified — there's no "music only" mode in the user-facing UI, so kicking
  // off both at the first gesture is the right default.
  if (!walking && encounters.length > 0) startWalk();
  status("Audio unlocked.");
  log("audio unlocked by user gesture");
}
document.addEventListener("click", unlockAudioOnGesture, { once: false });
document.addEventListener("keydown", unlockAudioOnGesture, { once: false });

// Push the layout image (or fall back to the location map) into the immersive bg.
function refreshImmersiveBg() {
  const layoutAttr = $("layoutImg").getAttribute("src");
  const mapAttr = $("locationMap").getAttribute("src");
  const bgUrl = layoutAttr ? layoutAttr
              : mapAttr ? mapAttr
              : null;
  if (bgUrl) {
    $("immersiveBg").style.backgroundImage = `url("${bgUrl}")`;
    // Decide between "fill the viewport" (small images) and "natural size + pan"
    // (large images). Use the layout/map element's natural dims as the truth.
    const sourceImg = layoutAttr ? $("layoutImg") : $("locationMap");
    const setDims = () => {
      const w = sourceImg.naturalWidth;
      const h = sourceImg.naturalHeight;
      if (!w || !h) return;
      const vw = window.innerWidth, vh = window.innerHeight;
      // Scale up small images to at least cover the viewport, but only by
      // integer multiples to keep the pixel art crisp.
      const scale = Math.max(1, Math.ceil(Math.max(vw / w, vh / h)));
      const dispW = w * scale;
      const dispH = h * scale;
      $("immersiveBg").style.backgroundSize = `${dispW}px ${dispH}px`;
      _immersiveBgDims = { w: dispW, h: dispH };
      // Spawn position based on arrival direction. If the user came from the
      // west (clicked a west connection on the previous route), they're moving
      // east — so we want them to start at the *western* edge of the new
      // layout, looking eastward into the rest of it. Same logic per axis.
      const overX = Math.max(0, dispW - vw);
      const overY = Math.max(0, dispH - vh);
      let nx = 0.5, ny = 0.5;
      if (_arrivalFrom) {
        const f = _arrivalFrom;
        if (f.includes("west")) nx = 0;       // start at left edge
        else if (f.includes("east")) nx = 1;  // start at right edge
        if (f.includes("north")) ny = 0;
        else if (f.includes("south")) ny = 1;
      }
      _panX = -overX * nx;
      _panY = -overY * ny;
      _arrivalFrom = null; // consumed
      $("immersiveBg").style.backgroundPosition = `${_panX}px ${_panY}px`;
    };
    if (sourceImg.complete && sourceImg.naturalWidth > 0) setDims();
    else sourceImg.addEventListener("load", setDims, { once: true });
  } else {
    $("immersiveBg").style.removeProperty("background-image");
    _immersiveBgDims = null;
  }
}

// Edge-scroll panning: cursor near an edge nudges the bg in that direction;
// dead zone in the middle. Camera state is { x, y } in pixels (clamped to
// the image's overhang). Velocity computed each frame from cursor proximity
// to edges. Stops smoothly when cursor returns to the dead zone.
const PAN_EDGE_THRESHOLD = 0.20;   // outer 20% of viewport on each side triggers pan
const PAN_MAX_SPEED = 600;         // px/sec at the very edge

let _panX = 0, _panY = 0;          // current background-position in px (negative = scrolled right/down)
let _cursorNx = 0.5, _cursorNy = 0.5;
let _panRafId = null;
let _panLastTs = 0;

function applyImmersivePan(nx, ny) {
  // Backwards-compat shim: callers that used the old "set position to cursor"
  // entry point now just store cursor coords; the RAF loop handles the rest.
  _cursorNx = nx;
  _cursorNy = ny;
}

// Compute the velocity contribution for one axis given normalized cursor pos.
// Returns 0 inside the dead zone; ramps to ±PAN_MAX_SPEED at the edges.
function panVelocityForAxis(n) {
  // n is 0..1; dead zone is [threshold, 1-threshold].
  if (n < PAN_EDGE_THRESHOLD) {
    const t = (PAN_EDGE_THRESHOLD - n) / PAN_EDGE_THRESHOLD; // 0..1 as cursor approaches edge
    return -PAN_MAX_SPEED * t * t; // ease-in
  }
  if (n > 1 - PAN_EDGE_THRESHOLD) {
    const t = (n - (1 - PAN_EDGE_THRESHOLD)) / PAN_EDGE_THRESHOLD;
    return PAN_MAX_SPEED * t * t;
  }
  return 0;
}

function panRafTick(ts) {
  if (!document.body.classList.contains("immersive") || !_immersiveBgDims) {
    _panRafId = null;
    return;
  }
  const dt = _panLastTs ? (ts - _panLastTs) / 1000 : 0;
  _panLastTs = ts;

  const vw = window.innerWidth, vh = window.innerHeight;
  const overX = Math.max(0, _immersiveBgDims.w - vw);
  const overY = Math.max(0, _immersiveBgDims.h - vh);

  const vx = panVelocityForAxis(_cursorNx);
  const vy = panVelocityForAxis(_cursorNy);

  if (vx !== 0 || vy !== 0) {
    _panX = Math.max(-overX, Math.min(0, _panX - vx * dt));
    _panY = Math.max(-overY, Math.min(0, _panY - vy * dt));
    $("immersiveBg").style.backgroundPosition = `${_panX}px ${_panY}px`;
    updateSpritePositions();
    showMinimap();
  }

  _panRafId = requestAnimationFrame(panRafTick);
}

// Minimap: outer box = scaled-down image dims, inner box = current viewport.
// Shown while panning, fades out 1s after pan stops.
let _minimapHideTimer = null;
function showMinimap() {
  if (!_immersiveBgDims) return;
  const mm = $("minimap");
  const view = $("minimapView");
  const dispW = _immersiveBgDims.w;
  const dispH = _immersiveBgDims.h;
  // Outer box adapts to the image's aspect ratio with a capped long-axis size.
  // The image fills the inner area exactly (no letterboxing), so a wide route
  // gets a wide minimap and a tall cave gets a tall one.
  const MAX_LONG = 160;
  const ar = dispW / dispH;
  let mmW, mmH;
  if (ar >= 1) { mmW = MAX_LONG; mmH = MAX_LONG / ar; }
  else { mmH = MAX_LONG; mmW = MAX_LONG * ar; }
  // Outer box = inner area + 8px padding (4 each side).
  mm.style.width = `${mmW + 8}px`;
  mm.style.height = `${mmH + 8}px`;

  const scale = mmW / dispW; // mmH / dispH gives the same value (we matched AR)
  const vw = window.innerWidth, vh = window.innerHeight;
  view.style.left = `${(-_panX) * scale}px`;
  view.style.top = `${(-_panY) * scale}px`;
  view.style.width = `${Math.min(vw * scale, mmW)}px`;
  view.style.height = `${Math.min(vh * scale, mmH)}px`;

  // Sprite dots: each .sprite-pos has imgX/imgY in image-space coords.
  // Remove old dots, then redraw.
  const inner = $("minimapInner");
  inner.querySelectorAll(".minimap-sprite").forEach((el) => el.remove());
  $("stage").querySelectorAll(".sprite-pos").forEach((sp) => {
    const ix = parseFloat(sp.dataset.imgX);
    const iy = parseFloat(sp.dataset.imgY);
    if (Number.isNaN(ix) || Number.isNaN(iy)) return;
    const dot = document.createElement("div");
    dot.className = "minimap-sprite";
    dot.style.left = `${ix * scale}px`;
    dot.style.top = `${iy * scale}px`;
    inner.appendChild(dot);
  });

  mm.classList.add("show");
  if (_minimapHideTimer) clearTimeout(_minimapHideTimer);
  _minimapHideTimer = setTimeout(() => {
    mm.classList.remove("show");
  }, 1000);
}

// Apply the current pan to any sprites carrying image-space coords.
function updateSpritePositions() {
  if (!document.body.classList.contains("immersive")) return;
  const sprites = $("stage").querySelectorAll(".sprite-pos");
  for (const el of sprites) {
    const imgX = parseFloat(el.dataset.imgX);
    const imgY = parseFloat(el.dataset.imgY);
    if (Number.isNaN(imgX) || Number.isNaN(imgY)) continue;
    el.style.setProperty("--sx", `${_panX + imgX - 48}px`);
    el.style.setProperty("--sy", `${_panY + imgY - 48}px`);
  }
}

function ensurePanLoop() {
  if (_panRafId !== null) return;
  _panLastTs = 0;
  _panRafId = requestAnimationFrame(panRafTick);
}

// Don't pan while the cursor is over a corner UI element (or a popover that
// belongs to one). RTS-style edge-pan vs corner-button conflict — if you
// reach for the map button, you don't want the layout sliding under you.
const PAN_UI_BLOCKERS = "#mapBtn, #encBtn, #hamburger, #player, #mapPopover, #encPanel, #sidebar, #searchWrap";

document.addEventListener("mousemove", (e) => {
  if (!document.body.classList.contains("immersive")) return;
  if (e.target && e.target.closest && e.target.closest(PAN_UI_BLOCKERS)) {
    _cursorNx = 0.5;
    _cursorNy = 0.5;
    return;
  }
  _cursorNx = e.clientX / window.innerWidth;
  _cursorNy = e.clientY / window.innerHeight;
  ensurePanLoop();
});

window.addEventListener("resize", () => {
  if (document.body.classList.contains("immersive")) refreshImmersiveBg();
});

function updateCaption() {
  const slug = $("slug").value.trim();
  const display = slug.replace(/-area$/, "").replace(/-/g, " ");
  $("immersiveCaption").textContent = `${display} · ${$("version").value}`;
}

// Edge-zone connection arrows.
function renderEdgeZones(connections) {
  const zones = { west: [], east: [], north: [], south: [] };
  // "near" connections (no direction) -> sprinkle into south zone as a fallback
  // so they're still discoverable in immersive mode.
  for (const c of (connections || [])) {
    const d = c.direction;
    if (d && zones[d]) zones[d].push(c);
    else zones.south.push(c);
  }
  for (const dir of Object.keys(zones)) {
    const zone = $("edge" + dir[0].toUpperCase() + dir.slice(1));
    if (!zone) continue;
    const inner = zone.querySelector(".conns");
    inner.innerHTML = "";
    if (zones[dir].length === 0) {
      zone.style.display = "none";
      continue;
    }
    zone.style.display = "";
    const arrow = ({ west: "←", east: "→", north: "↑", south: "↓" })[dir];
    for (const c of zones[dir]) {
      const btn = document.createElement("button");
      btn.className = "edge-conn";
      btn.textContent = `${arrow} ${c.name}`;
      btn.title = c.slug;
      btn.addEventListener("click", () => {
        // Going "dir" means arriving from the opposite. Use the zone's dir
        // (which reflects user intent — the edge they clicked) rather than
        // c.direction (which can be "near" with no spatial info).
        _arrivalFrom = oppositeDir(dir);
        $("slug").value = c.slug;
        $("load").click();
      });
      inner.appendChild(btn);
    }
  }
}

// Map popover (top-left button) shows the location map + connection list.
// --- Bottom-right music player ---
//
// Collapsed: ♪ + truncated track title. Click to expand. Expanded: prev/next
// (within most-recent searchBgm candidates), play/pause, scrub bar, and a
// candidate picker toggle (▾) that lists the alternatives so the user can
// pick a different track without re-running search.

function fmtTime(s) {
  if (!Number.isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60);
  return `${m}:${r.toString().padStart(2, "0")}`;
}

function currentBgmPosition() {
  if (!bgmBuffer || !audioCtx) return 0;
  if (!bgmSource) return _playerSeekOffset; // paused at the seek position
  const elapsed = audioCtx.currentTime - _playerStartedAt;
  const pos = (_playerSeekOffset + elapsed) % bgmBuffer.duration;
  return pos;
}

function refreshPlayer() {
  const player = $("player");
  if (!_playerCurrent) {
    player.style.display = "none";
    return;
  }
  player.style.display = "";
  player.querySelector(".player-title").textContent = _playerCurrent.title;
  $("playerToggle").textContent = bgmSource ? "⏸" : "▶";

  // Candidate picker.
  const list = $("playerCandidates");
  list.innerHTML = _playerCandidates.map((c) =>
    `<div class="player-candidate${c.title === _playerCurrent?.title ? " active" : ""}" data-title="${c.title}">${c.title} <span style="color:var(--muted);font-size:0.85em">(score ${c.score})</span></div>`
  ).join("");
  list.querySelectorAll(".player-candidate").forEach((el) => {
    el.addEventListener("click", () => {
      const c = _playerCandidates.find((x) => x.title === el.dataset.title);
      if (c) pickBgm(c);
    });
  });
}

function tickPlayerTime() {
  if (!_playerCurrent || !bgmBuffer) return;
  const pos = currentBgmPosition();
  const dur = bgmBuffer.duration;
  $("playerTime").textContent = `${fmtTime(pos)} / ${fmtTime(dur)}`;
  const scrub = $("playerScrub");
  if (document.activeElement !== scrub) {
    scrub.value = String((pos / dur) * 100);
  }

  // Loop-boundary detection: when position wraps past zero, we just completed
  // a loop. The threshold (dur/2) avoids false positives from sub-second clock
  // jitter; a real loop wrap is "position dropped by most of the duration."
  if (bgmSource && _bgmLastPos - pos > dur / 2) {
    _bgmLoopCount++;
    onBgmLoopComplete();
  }
  _bgmLastPos = pos;
}

// Called once per BGM loop boundary while playing. This is the wander hook —
// users move between locations on song completions, not on walk-step ticks.
function onBgmLoopComplete() {
  if (!walking) return;
  if (!$("wanderOn").checked) return;
  // First location of a session waits for ≥2 loops; subsequent locations only
  // need ≥1 (since the loop boundary IS the trigger, that's any boundary here).
  const minLoops = _isFirstLocationOfSession ? 2 : 1;
  if (_bgmLoopCount < minLoops) {
    log(`loop ${_bgmLoopCount}/${minLoops} — wander gated`);
    return;
  }
  if (currentConnections.length === 0) return;
  const wRate = parseFloat($("wanderRate").value);
  if (Math.random() >= wRate) {
    log(`loop ${_bgmLoopCount} — wander roll missed (p=${wRate})`);
    return;
  }
  const next = currentConnections[Math.floor(Math.random() * currentConnections.length)];
  log(`wander → ${next.name} (${next.slug})`);
  $("stage").innerHTML = "";
  _arrivalFrom = oppositeDir(next.direction);
  _isFirstLocationOfSession = false;
  $("slug").value = next.slug;
  navigateTo(next.slug);
}

// Run the time tick at 4 Hz (250ms). Cheap; only renders when player is open.
_playerInterval = setInterval(tickPlayerTime, 250);

$("player").addEventListener("click", (e) => {
  // Clicking buttons/scrub/candidates inside should NOT collapse/expand.
  if (e.target.closest(".player-btn, .player-scrub, .player-candidate, .player-controls")) return;
  const expanded = $("player").classList.toggle("expanded");
  // Collapsing also dismisses the candidate dropdown — otherwise a stale
  // dropdown peeks out the side of the collapsed pill.
  if (!expanded) $("player").classList.remove("show-candidates");
});

$("playerToggle").addEventListener("click", (e) => {
  e.stopPropagation();
  if (bgmSource) {
    // Pause: remember current position, stop.
    _playerSeekOffset = currentBgmPosition();
    stopBgm();
  } else if (bgmBuffer) {
    ensureAudio();
    if (audioCtx.state === "suspended") audioCtx.resume();
    startBgm(_playerSeekOffset);
  }
});

$("playerPrev").addEventListener("click", (e) => {
  e.stopPropagation();
  if (_playerCandidates.length === 0 || !_playerCurrent) return;
  const idx = _playerCandidates.findIndex((c) => c.title === _playerCurrent.title);
  const prev = _playerCandidates[(idx - 1 + _playerCandidates.length) % _playerCandidates.length];
  pickBgm(prev);
});

$("playerNext").addEventListener("click", (e) => {
  e.stopPropagation();
  if (_playerCandidates.length === 0 || !_playerCurrent) return;
  const idx = _playerCandidates.findIndex((c) => c.title === _playerCurrent.title);
  const next = _playerCandidates[(idx + 1) % _playerCandidates.length];
  pickBgm(next);
});

$("playerScrub").addEventListener("input", (e) => {
  if (!bgmBuffer) return;
  const pct = parseFloat(e.target.value) / 100;
  const target = pct * bgmBuffer.duration;
  // Web Audio sources can't seek; restart with offset.
  const wasPlaying = !!bgmSource;
  stopBgm();
  if (wasPlaying) startBgm(target);
  else _playerSeekOffset = target;
});

$("playerPickerToggle").addEventListener("click", (e) => {
  e.stopPropagation();
  $("player").classList.toggle("show-candidates");
  $("player").classList.add("expanded"); // ensure we're expanded
});

// Encounter panel: bottom-left widget mirroring the map button. Shows the
// current encounter table with sprites + percent, plus method pills (multi-
// select) and time-of-day picker. Editing here re-runs the merge from
// lastAreaData (no refetch).
$("encBtn").addEventListener("click", () => {
  const open = $("encPanel").classList.toggle("open");
  if (open) renderEncounterPanel();
});

function renderEncounterPanel() {
  const inner = $("encPanelInner");
  const totalChance = encounters.reduce((s, p) => s + p.chance, 0) || 1;
  const sortedSpecies = [...encounters].sort((a, b) => b.chance - a.chance);
  const currentSlug = $("slug").value.trim();

  // Area pills: shown when the parent location has multiple areas (split
  // routes like 204/205, multi-floor caves). Strip the longest common prefix
  // so labels read tersely (e.g. "north-towards-floaroma-town" instead of
  // "sinnoh-route-204-north-towards-floaroma-town").
  let areaPills = "";
  if (areaSiblings.length > 1) {
    const names = areaSiblings.map((a) => a.name);
    let prefix = names[0];
    for (const n of names) {
      while (!n.startsWith(prefix)) prefix = prefix.slice(0, -1);
    }
    areaPills = `<div class="enc-section">areas</div><div class="method-pills">${areaSiblings.map((a) => {
      const label = a.name.slice(prefix.length).replace(/^-/, "") || "main";
      return `<button class="method-pill${a.name === currentSlug ? " active" : ""}" data-area="${a.name}">${label.replace(/-/g, " ")}</button>`;
    }).join("")}</div>`;
  }

  // Method pills: every method PokéAPI knows about for this route+version.
  const methodList = [...availableMethods.entries()].sort((a, b) => b[1] - a[1]).map(([m]) => m);
  const methodPills = methodList.length === 0
    ? `<div class="enc-section">no methods available</div>`
    : `<div class="method-pills">${methodList.map((m) =>
        `<button class="method-pill${selectedMethods.has(m) ? " active" : ""}" data-method="${m}">${m}</button>`
      ).join("")}</div>`;

  const todChoice = $("tod").value;
  const todSelect = `
    <select id="encTod" style="width:100%;margin-bottom:0.5em;">
      ${["auto","time-morning","time-day","time-night","any"].map((v) =>
        `<option value="${v}"${v === todChoice ? " selected" : ""}>${v.replace("time-","")}</option>`
      ).join("")}
    </select>
  `;

  const speciesRows = sortedSpecies.length === 0
    ? `<div class="enc-section">empty</div>`
    : sortedSpecies.map((p) => {
        const pct = ((p.chance / totalChance) * 100).toFixed(1);
        const sprite = p.spriteUrl
          ? `<img src="${p.spriteUrl}" alt="${p.name}">`
          : `<span style="width:32px"></span>`;
        return `<div class="enc-row">${sprite}<span class="name">${p.name}</span><span class="pct">${pct}%</span></div>`;
      }).join("");

  // Encounter knobs: tucked behind a disclosure so the widget defaults to
  // glanceable encounter info; click to reveal tuning.
  const knobs = `
    <details class="enc-tuning" style="margin-top:0.4em;margin-bottom:0.4em;">
      <summary style="font-size:0.74em;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:0.2em 0;">tuning</summary>
      <div style="display:grid;grid-template-columns:auto 1fr auto;gap:0.4em 0.6em;align-items:center;font-size:0.85em;margin-top:0.4em;">
        <span>enc rate</span>
        <input id="encRateMirror" type="range" min="0" max="0.5" step="0.01" value="${$("encRate").value}" style="width:100%;">
        <span class="pct" style="min-width:3em;text-align:right;" id="encRateMirrorVal">${$("encRate").value}</span>

        <span>cry vol</span>
        <input id="cryVolMirror" type="range" min="0" max="1" step="0.05" value="${$("vol").value}" style="width:100%;">
        <span class="pct" id="cryVolMirrorVal" style="min-width:3em;text-align:right;">${$("vol").value}</span>

        <span>step (s)</span>
        <input id="stepMeanMirror" type="number" min="0.2" step="0.1" value="${$("stepMean").value}" style="width:5em;">
        <span></span>
      </div>
    </details>
  `;

  inner.innerHTML = areaPills + methodPills + todSelect + knobs + speciesRows;

  // Mirror inputs back to canonical hidden ones.
  inner.querySelector("#encRateMirror")?.addEventListener("input", (e) => {
    $("encRate").value = e.target.value;
    inner.querySelector("#encRateMirrorVal").textContent = e.target.value;
  });
  inner.querySelector("#cryVolMirror")?.addEventListener("input", (e) => {
    $("vol").value = e.target.value;
    inner.querySelector("#cryVolMirrorVal").textContent = e.target.value;
  });
  inner.querySelector("#stepMeanMirror")?.addEventListener("input", (e) => {
    $("stepMean").value = e.target.value;
  });

  // Area pill clicks: navigate to that sibling area.
  inner.querySelectorAll(".method-pill[data-area]").forEach((btn) => {
    btn.addEventListener("click", () => {
      $("slug").value = btn.dataset.area;
      $("load").click();
    });
  });

  // Wire pill clicks: toggle membership in selectedMethods, re-merge.
  inner.querySelectorAll(".method-pill[data-method]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const m = btn.dataset.method;
      if (selectedMethods.has(m)) {
        if (selectedMethods.size > 1) selectedMethods.delete(m);
        // Don't allow zero-method selection — keep at least one active.
      } else {
        selectedMethods.add(m);
      }
      // Mirror the legacy <select> to the first selected method for compat.
      $("method").value = [...selectedMethods][0];
      reMergeEncounters();
    });
  });

  // Wire time-of-day change.
  inner.querySelector("#encTod")?.addEventListener("change", (e) => {
    $("tod").value = e.target.value;
    reMergeEncounters();
  });
}

// Re-run the encounter merge using the cached area data + current selections,
// skipping the network round-trip and the per-species cry/sprite refetch.
async function reMergeEncounters() {
  if (!lastAreaData) return;
  const version = $("version").value;
  const todChoice = $("tod").value;
  const band = todChoice === "auto" ? localTimeBand()
             : todChoice === "any" ? null
             : todChoice;
  const TIME_VALUES = new Set(["time-morning", "time-day", "time-night"]);

  // Reuse the existing per-species sprite/cry data we fetched on the original load.
  const existing = new Map(encounters.map((p) => [p.name, p]));

  const tally = new Map();
  for (const enc of lastAreaData.pokemon_encounters) {
    const vd = enc.version_details.find((v) => v.version.name === version);
    if (!vd) continue;
    let chanceSum = 0;
    for (const ed of vd.encounter_details) {
      if (!selectedMethods.has(ed.method.name)) continue;
      const timeConds = ed.condition_values
        .map((c) => c.name).filter((n) => TIME_VALUES.has(n));
      const matches = band === null || timeConds.length === 0 || timeConds.includes(band);
      if (!matches) continue;
      chanceSum += ed.chance;
    }
    if (chanceSum > 0) tally.set(enc.pokemon.name, { name: enc.pokemon.name, url: enc.pokemon.url, chance: chanceSum });
  }

  // Fill in cry/sprite from cache; fetch missing.
  const list = [...tally.values()];
  await Promise.all(list.map(async (p) => {
    const cached = existing.get(p.name);
    if (cached) {
      p.cryUrl = cached.cryUrl;
      p.spriteUrl = cached.spriteUrl;
      return;
    }
    try {
      const r = await fetch(p.url);
      const data = await r.json();
      p.cryUrl = data.cries?.latest || data.cries?.legacy || null;
      const gen4 = data.sprites?.versions?.["generation-iv"];
      p.spriteUrl = gen4?.platinum?.front_default
        || gen4?.["diamond-pearl"]?.front_default
        || gen4?.["heartgold-soulsilver"]?.front_default
        || data.sprites?.front_default || null;
    } catch {}
  }));
  encounters = list.filter((p) => p.cryUrl);
  renderTable();
  renderEncounterPanel();
  $("start").disabled = encounters.length === 0;
}

$("mapBtn").addEventListener("click", () => {
  const pop = $("mapPopover");
  const open = pop.classList.toggle("open");
  if (open) renderMapPopover();
});

function renderMapPopover() {
  const map = $("locationMap");
  const conns = $("connections");
  const wanderOn = $("wanderOn").checked;
  const wanderRate = $("wanderRate").value;
  const html = `
    ${map.src ? `<img src="${map.src}" alt="">` : `<div style="color:var(--muted)">no map</div>`}
    <div class="conn-list">${conns.innerHTML || ""}</div>
    <div class="enc-section" style="margin-top:0.8em;">wander</div>
    <div style="display:flex;gap:0.6em;align-items:center;font-size:0.88em;">
      <label><input id="wanderOnMirror" type="checkbox"${wanderOn ? " checked" : ""}> on</label>
      <label style="flex:1;">p
        <input id="wanderRateMirror" type="range" min="0" max="1" step="0.05" value="${wanderRate}" style="width:100%;vertical-align:middle;">
      </label>
      <span class="pct" id="wanderRateMirrorVal">${wanderRate}</span>
    </div>
    <div class="map-caption" style="margin-top:0.3em;">Fires on each BGM loop boundary.</div>
  `;
  $("mapPopoverInner").innerHTML = html;
  $("mapPopoverInner").querySelectorAll(".conn-list button").forEach((btn) => {
    const slug = btn.getAttribute("title");
    if (slug) {
      btn.addEventListener("click", () => {
        const conn = currentConnections.find((c) => c.slug === slug);
        if (conn) _arrivalFrom = oppositeDir(conn.direction);
        $("slug").value = slug;
        $("load").click();
        $("mapPopover").classList.remove("open");
      });
    }
  });
  $("wanderOnMirror")?.addEventListener("change", (e) => {
    $("wanderOn").checked = e.target.checked;
  });
  $("wanderRateMirror")?.addEventListener("input", (e) => {
    $("wanderRate").value = e.target.value;
    $("wanderRateMirrorVal").textContent = e.target.value;
  });
}

// "/" focuses search in immersive mode.
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.body.classList.contains("immersive")) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    e.preventDefault();
    $("searchWrap").classList.add("focus");
    $("searchInput").focus();
    $("searchInput").select();
  } else if (e.key === "Escape") {
    $("searchWrap").classList.remove("focus");
    $("mapPopover").classList.remove("open");
  } else if (e.key === "m" && document.body.classList.contains("immersive")) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    $("mapBtn").click();
  }
});

// Hide search when it loses focus in immersive (and the user isn't picking a result).
$("searchInput").addEventListener("blur", () => {
  // Delay so result clicks register before hiding.
  setTimeout(() => {
    if (document.body.classList.contains("immersive") &&
        document.activeElement !== $("searchInput")) {
      $("searchWrap").classList.remove("focus");
    }
  }, 200);
});

$("rebuildIndex")?.addEventListener("click", async () => {
  localStorage.removeItem(SEARCH_INDEX_KEY);
  await buildSearchIndex();
});

// Single navigation pipeline: every Load = fresh encounters + fresh location +
// fresh BGM resolution. searchBgm auto-picks the top candidate; pickBgm uses
// the trackTitle-keyed mp3 cache to skip the network round-trip when possible.
$("load").addEventListener("click", async () => {
  await loadEncounters();
  loadLocationInfo();
  await searchBgm();
});
$("start").addEventListener("click", startWalk);
$("stop").addEventListener("click", stopWalk);
$("searchBgm").addEventListener("click", searchBgm);
$("changeBgm").addEventListener("click", searchBgm);
$("bgmVol").addEventListener("input", (e) => {
  if (bgmGain) bgmGain.gain.value = parseFloat(e.target.value);
});
